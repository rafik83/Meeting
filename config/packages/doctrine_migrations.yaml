doctrine_migrations:
    migrations_paths:
        # namespace is arbitrary but should be different from App\Migrations
        # as migrations classes should NOT be autoloaded
        'Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Migrations': '%kernel.project_dir%/src/Infrastructure/Bundle/InfrastructureBundle/Migrations'
    storage:
        table_storage:
            table_name: 'migration_versions'
