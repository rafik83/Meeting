version: "3"

networks:
    proxy:
        external:
            name: proxy

volumes:
    db_data: ~
    logs: ~

services:
    database:
        image: mysql:5.6
        volumes:
            - db_data:/var/lib/mysql
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: proximum_vimeet
            MYSQL_USER: app
            MYSQL_PASSWORD: password
        ports:
            - "3306:3306"
        networks:
            - proxy

    elasticsearch:
        image: elasticsearch:1.7
        ports:
            - "9200:9200"
        networks:
            - proxy

    nginx:
        image: nginx
        volumes:
            - .:/srv
            - ./docker/nginx/app_php_fpm:/etc/nginx/conf.d/app_php_fpm
            - ./docker/nginx/app_gzip:/etc/nginx/conf.d/app_gzip
            - ./docker/nginx/app.conf:/etc/nginx/conf.d/app.conf
        ports:
            - "8000:80"
        networks:
            - proxy

    php:
        build: docker/php
        networks:
            - proxy
        volumes:
            - .:/srv
            - logs:/srv/var/logs
