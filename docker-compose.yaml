version: "3"

networks:
    proxy:
        external:
            name: proxy

volumes:
    db_data: ~

services:
    database:
        image: mysql:5.6
        volumes:
            - db_data:/var/lib/mysql
        environment:
            MYSQL_DATABASE: proximum_vimeet_test
            MYSQL_USER: app
            MYSQL_PASSWORD: password
            MYSQL_ROOT_PASSWORD: password
        ports:
            - "3306:3306"
        networks:
            - proxy

    elasticsearch:
        image: elasticsearch:6.8.13
        ports:
            - "9200:9200"
        networks:
            - proxy

    php-ci:
        build: docker/php-ci
        environment:
            SYMFONY_ENV: "test"
            TZ: "Europe/Paris"
        volumes:
            - .:/srv
        networks:
            - proxy
        depends_on:
            - database

    redis:
        image: redis:5-alpine
        ports:
            - "6379:6379"
        networks:
            - proxy

    mercure:
        image: dunglas/mercure:v0.10
        ports:
            - "8088:80"
        environment:
            PUBLISHER_JWT_KEY: "secretkey"
            SUBSCRIBER_JWT_KEY: "secretkey"
            ALLOW_ANONYMOUS: "0"
            CORS_ALLOWED_ORIGINS: "*"
            SUBSCRIPTIONS: "1"
        networks:
            - proxy
