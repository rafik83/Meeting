apiVersion: v1
kind: Secret
metadata:
  name: {{ template "vimeet.fullname" . }}
  labels:
    app: "{{ template "vimeet.name" . }}"
    chart: "{{ template "vimeet.chart" . }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
  annotations:
    strategy.spinnaker.io/versioned: 'false'
type: Opaque
stringData:
        {{- if .Values.mysql.enabled }}
    MASTER_PASS: {{ .Values.mysql.mysqlPassword }}
        {{- else }}
    MASTER_PASS: {{ .Values.externalDatabase.password }}
        {{- end }}
        {{- if .Values.externalDatabase.slave.hostList }}
    SLAVE_PASS: {{ .Values.externalDatabase.slave.password }}
        {{- end }}
