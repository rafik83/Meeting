machine:
    timezone: Europe/Paris
    php:
        version: 7.1.6
    node:
        version: 8.9.1
    services:
        - mysql
dependencies:
    cache_directories:
        - node_modules
        - vendor
    override:
        - echo "date.timezone = UTC" >> /opt/circleci/php/$(phpenv global)/etc/php.ini
        - echo "memory_limit = 512M" > /opt/circleci/php/$(phpenv global)/etc/conf.d/memory.ini
        - wget https://download.elastic.co/elasticsearch/elasticsearch/elasticsearch-1.7.0.tar.gz
        - tar -xvf elasticsearch-1.7.0.tar.gz
        - elasticsearch-1.7.0/bin/elasticsearch: {background: true}
        # Make sure that Elasticsearch is up before running tests:
        - sleep 10 && wget --waitretry=5 --retry-connrefused -v http://127.0.0.1:9200/
        - make install-app@test
        - make install-db@test
        - make install-dep
        - make build@prod
        - export PATH=$(npm bin):$PATH
test:
    pre:
        - echo "SET GLOBAL sql_mode=(SELECT REPLACE(@@sql_mode,'ONLY_FULL_GROUP_BY',''));" | mysql
    override:
        - bin/phpunit
        - bin/console cache:clear --env=test
        - bin/console fos:elastica:reset --env=test --no-debug
        - bin/behat --format progress --no-interaction
notify:
    webhooks:
        - url: https://webhooks.gitter.im/e/9e2f71cf79968c2d8303
