---

############
# Strategy #
############

manala_deploy_strategy_git_version: preprod

############
# Releases #
############

manala_deploy_releases: 3

###########
# Removed #
###########

manala_deploy_removed:
  - web/app_test.php

#########
# Tasks #
#########

manala_deploy_tasks:
  - make: install@prod
  - make: build@prod
  - make: migration@prod
  - command: sudo /usr/sbin/service php7.1-fpm reload
  - command: sudo supervisorctl restart all
