---

app_options:

  php:                   true
  php_version:           '5.6'
  nodejs:                true
  nodejs_version:        '0.12'
  mysql:                 true
  mysql_version:         '5.6'
  mongodb:               false
  mongodb_version:       '3.2'
  mariadb:               false
  mariadb_version:       '10.1'
  postgresql:            false
  postgresql_version:    '9.5'
  elasticsearch:         true
  elasticsearch_version: '1.7'
  redis:                 false
  influxdb:              false
  java:                  false

app_patterns:

  ############
  # Timezone #
  ############

  timezone_default: Etc/UTC

  ###############
  # Environment #
  ###############

  environment_variables:
    - SYMFONY_ENV:                 "{{ app.env }}"
    - APP_SECRET:                  ThisTokenIsNotSoSecretChangeIt
    - APP_DATABASE_HOST:           127.0.0.1
    - APP_DATABASE_PORT:           null
    - APP_DATABASE_NAME:           app
    - APP_DATABASE_USER:           "{{ app.user }}"
    - APP_DATABASE_PASSWORD:       null

  #######
  # Ssh #
  #######

  ssh_config:

    # Demo
    - Host *.elao.ninja.local:
      - User:                  deploy
      - ProxyCommand:          ssh gateway@hv-1.elao.ninja "nc %h %p"
      - ForwardAgent:          true
      - StrictHostKeyChecking: false
      - HashKnownHosts:        false

    # Synalabs
    - Host proximum-gw:
      - Hostname: 163.172.194.152
      - User:     elao
      - Port:     22

    # Preprod
    - Host proximum-vimeet-preprod:
      - User:         www-data
      - ProxyCommand: ssh proximum-gw nc vimeet-preprod %p

    # Prod
    - Host proximum-mysql-master:
      - User:         www-data
      - ProxyCommand: ssh proximum-gw nc mysql-master %p

    - Host proximum-web-apache-01:
      - User:         www-data
      - ProxyCommand: ssh proximum-gw nc web-apache-01 %p

    - Host proximum-web-apache-02:
      - User:         www-data
      - ProxyCommand: ssh proximum-gw nc web-apache-02 %p

    - Host proximum-filer:
      - User:         www-data
      - ProxyCommand: ssh proximum-gw nc filer %p

    - Host proximum-es-01:
      - User:         www-data
      - ProxyCommand: ssh proximum-gw nc es-01

  ########
  # Motd #
  ########

  motd_template: template/elao.j2
  motd_message:  California - 1993

  #########
  # Files #
  #########

  files_attributes:
    - path:  "{{ app.dir }}{{ app.dir_release }}/var/logs"
      src:   "{{ app.log_dir }}"
      state: link_directory
    - path:  "{{ app.dir }}{{ app.dir_release }}/var/cache"
      src:   "{{ app.cache_dir }}"
      state: link_directory

  #######
  # Npm #
  #######

  npm_packages:
    - package: gulp
      version: 3

  #######
  # Php #
  #######

  php_extensions:
    # Symfony
    - intl
    - curl
    - mbstring
    - xml
    # Composer
    - zip
    # App
    - imagick

  php_applications:
    - openl10n@0.2.0

  php_configs:
    - file: app_opcache.ini
      template: configs/app_opcache.{{ env }}.j2
    - file: app.ini
      template: configs/app.{{ env }}.j2
      config:
        - date.timezone: UTC
        - upload_max_filesize: 8M
        - post_max_size: 8M
        - max_execution_time: 120
        - always_populate_raw_post_data: -1
        - max_input_vars: 10000

  #########
  # Nginx #
  #########

  nginx_configs:
    # Php fpm
    - file:     app_php_fpm
      template: configs/app_php_fpm.{{ env }}.j2
    # Gzip
    - file:     app_gzip
      template: configs/app_gzip.{{ env }}.j2
    # App
    - file: app.conf
      config:
        - server:
          - server_name: "{{ app.host }} *.{{ app.host }}"
          #- server_name: "*.ngrok.io"
          - root:        "{{ app.dir }}{{ app.dir_release }}/web"
          - access_log:  "{{ app.log_dir }}/nginx.access.log"
          - error_log:   "{{ app.log_dir }}/nginx.error.log"
          - client_max_body_size: 8M
          - include:     conf.d/app_gzip
          - location /:
            - try_files: $uri /app.php$is_args$args
          - location ~ ^/(app(_[-\w]+)?)\.php(/|$):
            - include: conf.d/app_php_fpm
            #- internal;

  #################
  # Elasticsearch #
  #################

  elasticsearch_plugins:
    - name:       head
      repository: mobz/elasticsearch-head

  ########
  # Cron #
  ########

  #cron_files:
  #  - file: app
  #    user: "{{ app.user }}"
  #    environment:
  #      - SYMFONY_ENV: "{{ app.env }}"
  #    jobs:
  #      - name:   foo-bar
  #        job:    "cd {{ app.dir }}{{ app.dir_release }} && php bin/console app:foo:bar --no-interaction -vv >> {{ app.log_dir }}/cron.foo-bar.log 2>&1"
  #        minute: 0
  #        hour:   7
  #        # Dev
  #        state:  absent

  ##############
  # Supervisor #
  ##############

  #supervisor_configs:
  #  - file:     app.conf
  #    template: configs/app_program.{{ env }}.j2
  #    config:
  #      - foo-bar:
  #        - command:        php bin/console app:foo:bar --no-interaction -vv
  #        - directory:      "{{ app.dir }}{{ app.dir_release }}"
  #        - user:           "{{ app.user }}"
  #        - stdout_logfile: "{{ app.log_dir }}/supervisor.foo-bar.log"
  #        - environment:    "SYMFONY_ENV=\"{{ app.env }}\""
  #        # Dev
  #        - autostart:       false



  ##############
  # Supervisor #
  ##############

  supervisor_configs:
    - file:     app.conf
      template: configs/app_program.{{ env }}.j2
      config:
        - jms-job-queue:
          - command:        php bin/console jms-job-queue:run --no-interaction -vv
          - directory:      "{{ app.dir }}{{ app.dir_release }}"
          - user:           "{{ app.user }}"
          - stdout_logfile: "{{ app.log_dir }}/supervisor.jms-job-queue.log"
          - environment:    "SYMFONY_ENV=\"{{ app.env }}\""
          # Dev
          - autostart:       false
