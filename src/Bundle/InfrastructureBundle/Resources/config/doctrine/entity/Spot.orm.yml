Proximum\Vimeet\Domain\Model\Spot:
    type:  entity
    table: spot
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        reference:
            type: string
        size:
            type: float
        meetingCapacity:
            type: integer
        seatCapacity:
            type: integer
        active:
            type: boolean
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
    uniqueConstraints:
        unique_reference_idx:
            columns: [reference, event_id]
