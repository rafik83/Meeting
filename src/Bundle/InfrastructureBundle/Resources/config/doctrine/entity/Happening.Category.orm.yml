Proximum\Vimeet\Domain\Model\Happening\Category:
    type:  entity
    table: happening_category
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    oneToMany:
        translations:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\CategoryTranslation
            mappedBy: type
            indexBy: locale
            cascade: ["persist"]
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
