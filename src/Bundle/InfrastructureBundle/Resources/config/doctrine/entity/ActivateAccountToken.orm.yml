Proximum\Vimeet\Domain\Model\ActivateAccountToken:
    type:  entity
    table: activate_account_token
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        token:
            type: string
            unique: true
        expireDate:
            type: datetime
    oneToOne:
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
    manyToOne:
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
