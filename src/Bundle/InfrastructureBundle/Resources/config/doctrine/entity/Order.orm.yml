Proximum\Vimeet\Domain\Model\Order:
    type: entity
    table: _order
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        state:
            type: string
        packageData:
            type: json_array
        packageTemplate:
            type: json_array
        billingData:
            type: json_array
        billingTemplate:
            type: json_array
        createdAt:
            type: datetime
        paymentMode:
            type: string
        vatMode:
            type: string
        vatRate:
            type: float
    manyToOne:
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            inversedBy: orders
