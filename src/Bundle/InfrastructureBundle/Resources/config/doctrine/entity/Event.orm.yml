Proximum\Vimeet\Domain\Model\Event:
    type:  entity
    table: event
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        domain:
            type: string
        timeZone:
            type: string
        locales:
            type: json_array
        fallback:
            type: string
        billingTemplate:
            type: json_array
        organiserName:
            type: string
        paymentAddress:
            type: string
        organiserEmail:
            type: string
        bankInfo:
            type: string
        legalInformation:
            type: string
        vat:
            type: integer
        elementToJoinWithInvoice:
            type: string
    oneToMany:
        translations:
            targetEntity: Proximum\Vimeet\Domain\Model\EventTranslation
            mappedBy: event
            indexBy: locale
            cascade: ["all"]
            orphanRemoval: true
