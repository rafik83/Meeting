Proximum\Vimeet\Domain\Model\Happening:
    type:  entity
    table: happening
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        begin:
            type: datetime
        end:
            type: datetime
    oneToMany:
        titleTranslations:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\TitleTranslation
            mappedBy: happening
            indexBy: locale
            cascade: ["persist"]
        descriptionTranslations:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\DescriptionTranslation
            mappedBy: happening
            indexBy: locale
            cascade: ["persist"]
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
        category:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\Category
