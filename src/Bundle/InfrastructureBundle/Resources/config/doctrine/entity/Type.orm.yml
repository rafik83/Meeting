Proximum\Vimeet\Domain\Model\Type:
    type:  entity
    table: participant_type
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        position:
            type: integer
    oneToMany:
        translations:
            targetEntity: Proximum\Vimeet\Domain\Model\TypeTranslation
            mappedBy: type
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
