Proximum\Vimeet\Domain\Model\EventTranslation:
    type:  entity
    table: event_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        description:
            type: string
        locale:
            type: string
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            inversedBy: translations
