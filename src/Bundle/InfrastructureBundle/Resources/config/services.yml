    # Fixture providers
    #
    vimeet_infrastructure.data_fixtures_orm.provider:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\DataFixtures\ORM\Provider
        arguments:
            - %domain%
        tags:
            - { name: hautelook_alice.faker.provider }

    #
    # Handlers
    #
    vimeet_infrastructure.application.command.user.register_handler:
        class: Proximum\Vimeet\Application\Command\User\RegisterHandler
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.adapter.encoder_adapter'
            - '@vimeet_infrastructure.adapter.salt_generator'
    vimeet_infrastructure.application.command.user.change_password:
        class: Proximum\Vimeet\Application\Command\User\ChangePasswordHandler
        arguments:
