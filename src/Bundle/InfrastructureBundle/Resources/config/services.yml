services:
    #
    # Repositories
    #
    vimeet_infrastructure.repository.event_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\EventRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@knp_paginator'
    vimeet_infrastructure.repository.type_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\TypeRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@knp_paginator'
    vimeet_infrastructure.repository.category_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\CategoryRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@knp_paginator'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.repository.user_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\UserRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.participant_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\ParticipantRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.sheet_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\SheetRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.repository.rule_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\RuleRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.nomenclature_item_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\NomenclatureItemRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.schedule_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\ScheduleRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.unavailability_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\UnavailabilityRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.forgotten_password_token_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\ForgottenPasswordTokenRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.meeting.request_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\Meeting\RequestRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@knp_paginator'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
    vimeet_infrastructure.repository.notification_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\NotificationRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.happening_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\HappeningRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.happening_participation_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\HappeningParticipationRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.order_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\OrderRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.meeting_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\MeetingRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@knp_paginator'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
    vimeet_infrastructure.repository.meeting_slot_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\MeetingSlotRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.cart_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\CartRepository
        arguments:
            - '@doctrine.orm.entity_manager'

    #
    # Fixture providers
    #
    vimeet_infrastructure.data_fixtures_orm.provider:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\DataFixtures\ORM\Provider
        arguments:
            - %domain%
        tags:
            - { name: hautelook_alice.faker.provider }

    #
    # Handlers
    #
    vimeet_infrastructure.application.command.user.register_handler:
        class: Proximum\Vimeet\Application\Command\User\RegisterHandler
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.adapter.encoder_adapter'
            - '@vimeet_infrastructure.adapter.salt_generator'
    vimeet_infrastructure.application.command.user.change_password:
        class: Proximum\Vimeet\Application\Command\User\ChangePasswordHandler
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.adapter.encoder_adapter'
            - '@vimeet_infrastructure.adapter.salt_generator'
    vimeet_infrastructure.application.command.user.participate_handler:
        class: Proximum\Vimeet\Application\Command\User\ParticipateHandler
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@vimeet_infrastructure.repository.participant_repository'
    vimeet_infrastructure.vimeet.application.command.participant.update_handler:
        class: Proximum\Vimeet\Application\Command\Participant\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.participant_repository'
    vimeet_infrastructure.vimeet.application.command.participant.add_handler:
        class: Proximum\Vimeet\Application\Command\Participant\AddHandler
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.participant_repository'
    vimeet_infrastructure.vimeet.application.command.sheet.update_block_handler:
        class: Proximum\Vimeet\Application\Command\Sheet\UpdateBlockHandler
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
    vimeet_infrastructure.vimeet.application.command.sheet.buy_participant_handler:
        class: Proximum\Vimeet\Application\Command\Sheet\BuyParticipantHandler
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.participant_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
    vimeet_infrastructure.vimeet.application.command.participant.delete_handler:
        class: Proximum\Vimeet\Application\Command\Participant\DeleteHandler
        arguments:
            - '@vimeet_infrastructure.repository.participant_repository'
    vimeet_infrastructure.vimeet.application.command.package.update_step_handler:
        class: Proximum\Vimeet\Application\Command\Package\UpdateStepHandler
        arguments:
            - '@vimeet_infrastructure.repository.cart_repository'
    vimeet_infrastructure.vimeet.application.command.package.add_products_handler:
        class: Proximum\Vimeet\Application\Command\Package\AddProductsHandler
        arguments:
            - '@vimeet_infrastructure.repository.cart_repository'
    vimeet_infrastructure.vimeet.application.command.billing.update_handler:
        class: Proximum\Vimeet\Application\Command\Billing\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
    vimeet_infrastructure.vimeet.application.command.update_handler:
        class: Proximum\Vimeet\Application\Command\Event\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
    vimeet_infrastructure.vimeet.application.command.type.update_handler:
        class: Proximum\Vimeet\Application\Command\Type\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.vimeet.application.command.type.create_handler:
        class: Proximum\Vimeet\Application\Command\Type\CreateHandler
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.vimeet.application.command.category.update_handler:
        class: Proximum\Vimeet\Application\Command\Category\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.category_repository'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.vimeet.application.command.category.create_handler:
        class: Proximum\Vimeet\Application\Command\Category\CreateHandler
        arguments:
            - '@vimeet_infrastructure.repository.category_repository'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.vimeet.application.command.unavailability.add_unavailability_handler:
        class: Proximum\Vimeet\Application\Command\Unavailability\AddHandler
        arguments:
            - '@vimeet_infrastructure.repository.unavailability_repository'
    vimeet_infrastructure.vimeet.application.command.unavailability.update_handler:
        class: Proximum\Vimeet\Application\Command\Unavailability\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.unavailability_repository'
    vimeet_infrastructure.vimeet.application.command.unavailability.remove_handler:
        class: Proximum\Vimeet\Application\Command\Unavailability\RemoveHandler
        arguments:
            - '@vimeet_infrastructure.repository.unavailability_repository'
    vimeet_infrastructure.vimeet.application.command.type_template_field.update_handler:
        class: Proximum\Vimeet\Application\Command\TypeTemplateField\UpdateHandler
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.vimeet.application.command.user.forgotten_password_handler:
        class: Proximum\Vimeet\Application\Command\User\ForgottenPasswordHandler
        arguments:
            - '@vimeet_infrastructure.vimeet.application.components.token.forgotten_password_token_generator'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.forgotten_password_token_repository'
            - '@vimeet_infrastructure.event.event_dispatcher'
    vimeet_infrastructure.vimeet.application.command.user.new_password_handler:
        class: Proximum\Vimeet\Application\Command\User\NewPasswordHandler
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.adapter.encoder_adapter'
            - '@vimeet_infrastructure.adapter.salt_generator'
            - '@vimeet_infrastructure.repository.forgotten_password_token_repository'
    vimeet_infrastructure.vimeet.application.components.happening.participate_handler:
        class: Proximum\Vimeet\Application\Command\Happening\ParticipateHandler
        arguments:
            - '@vimeet_infrastructure.repository.happening_participation_repository'
    vimeet_infrastructure.vimeet.application.components.happening.unparticipate_handler:
        class: Proximum\Vimeet\Application\Command\Happening\UnparticipateHandler
        arguments:
            - '@vimeet_infrastructure.repository.happening_participation_repository'
    vimeet_infrastructure.vimeet.application.command.meeting.create_request_handler:
        class: Proximum\Vimeet\Application\Command\Meeting\CreateRequestHandler
        arguments:
            - '@vimeet_infrastructure.repository.meeting.request_repository'
    vimeet_infrastructure.vimeet.application.command.meeting.approve_request_handler:
        class: Proximum\Vimeet\Application\Command\Meeting\ApproveRequestHandler
        arguments:
            - '@vimeet_infrastructure.repository.meeting.request_repository'
    vimeet_infrastructure.vimeet.application.command.meeting.refuse_request_handler:
        class: Proximum\Vimeet\Application\Command\Meeting\RefuseRequestHandler
        arguments:
            - '@vimeet_infrastructure.repository.meeting.request_repository'
            - '@vimeet_infrastructure.repository.notification_repository'
            - '@datetime'
    vimeet_infrastructure.vimeet.application.command.order.create_handler:
        class: Proximum\Vimeet\Application\Command\Order\CreateHandler
        arguments:
            - '@vimeet_infrastructure.repository.order_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@vimeet_infrastructure.repository.cart_repository'
            - '@vimeet_infrastructure.application.components.order.order_manager'
    vimeet_infrastructure.vimeet.application.command.meeting_request.position_meeting_handler:
        class: Proximum\Vimeet\Application\Command\MeetingRequest\PositionMeetingHandler
        arguments:
            - '@vimeet_infrastructure.repository.meeting_repository'
            - '@vimeet_infrastructure.repository.meeting.request_repository'
            - '@vimeet_infrastructure.repository.meeting_slot_repository'
    vimeet_infrastructure.vimeet.application.command.meeting.cancel_request_handler:
        class: Proximum\Vimeet\Application\Command\Meeting\CancelRequestHandler
        arguments:
            - '@vimeet_infrastructure.repository.meeting.request_repository'
            - '@vimeet_infrastructure.repository.notification_repository'
            - '@datetime'

    #
    # Security
    #
    vimeet_infrastructure.security.user_password_encoder:
        class: Symfony\Component\Security\Core\Encoder\PasswordEncoderInterface
        factory: ['@security.encoder_factory', 'getEncoder']
        arguments:
            - Proximum\Vimeet\Domain\Model\User
    vimeet_infrastructure.adapter.salt_generator:
        class: Proximum\Vimeet\Application\Adapter\SaltGenerator
    vimeet_infrastructure.adapter.encoder_adapter:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Adapter\EncoderAdapter
        arguments:
            - '@vimeet_infrastructure.security.user_password_encoder'

    #
    # Components
    #
    vimeet_infrastructure.application.components.cart.cart_builder:
        class: Proximum\Vimeet\Application\Components\Cart\CartBuilder
    vimeet_infrastructure.application.components.cart.cart_manager:
        class: Proximum\Vimeet\Application\Components\Cart\CartManager
        arguments:
            - '@vimeet_infrastructure.repository.cart_repository'
    vimeet_infrastructure.application.components.product.product_builder:
        class: Proximum\Vimeet\Application\Components\Product\ProductBuilder
    vimeet_infrastructure.application.components.order.order_manager:
        class: Proximum\Vimeet\Application\Components\Order\OrderManager

    #
    # Carts components
    #
    vimeet_infrastructure.application.components.cart.carts.lib_choice_with_description_cart:
        class: Proximum\Vimeet\Application\Components\Cart\Carts\LibChoiceWithDescriptionCart
        tags:
            - { name: cart, cart: choice_with_description }
    vimeet_infrastructure.application.components.cart.carts.lib_option_cart:
        class: Proximum\Vimeet\Application\Components\Cart\Carts\LibOptionCart
        tags:
            - { name: cart, cart: lib_option }
    vimeet_infrastructure.application.components.cart.carts.lib_participant_cart:
        class: Proximum\Vimeet\Application\Components\Cart\Carts\LibParticipantCart
        tags:
            - { name: cart, cart: lib_participant }
    vimeet_infrastructure.application.components.cart.carts.lib_planning_cart:
        class: Proximum\Vimeet\Application\Components\Cart\Carts\LibPlanningCart
        tags:
            - { name: cart, cart: lib_planning }

    #
    # Sheet Component
    #
    vimeet_infrastructure.application.components.sheet.manager:
        class: Proximum\Vimeet\Application\Components\Sheet\SheetManager
        arguments:
            - '@vimeet_infrastructure.repository.participant_repository'
            - '@vimeet_infrastructure.application.components.rule.manager'
            - '@vimeet_infrastructure.repository.type_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@vimeet_infrastructure.repository.meeting.request_repository'
    vimeet_infrastructure.application.components.sheet.sheet_info_guesser:
        class: Proximum\Vimeet\Application\Components\Sheet\SheetInfoGuesser
        arguments:
            - '@vimeet_infrastructure.application.components.sheet.participant_info_guesser'

    #
    # Event
    #
    vimeet_infrastructure.event.event_dispatcher:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Event\EventDispatcher
        arguments:
            - '@event_dispatcher'

    #
    # Rule Component
    #
    vimeet_infrastructure.vimeet.application.components.rule.rule_sorter:
        class: Proximum\Vimeet\Application\Components\Rule\RuleSorter
    vimeet_infrastructure.application.components.rule.manager:
        class: Proximum\Vimeet\Application\Components\Rule\RuleManager
        arguments:
            - '@vimeet_infrastructure.repository.rule_repository'
            - '@vimeet_infrastructure.repository.type_repository'
            - '@vimeet_infrastructure.vimeet.application.components.rule.rule_sorter'

    #
    # Token component
    #
    vimeet_infrastructure.vimeet.application.components.token.forgotten_password_token_generator:
        class: Proximum\Vimeet\Application\Components\Token\ForgottenPasswordTokenGenerator
        arguments:
            - '@datetime'

    #
    # Participant component
    #
    vimeet_infrastructure.application.components.sheet.participant_info_guesser:
        class: Proximum\Vimeet\Application\Components\Participant\ParticipantInfoGuesser

    #
    # Schedule component
    #
    proximum.vimeet.application.components.schedule.schedule_builder:
        class: Proximum\Vimeet\Application\Components\Schedule\ScheduleBuilder
        arguments:
            - '@vimeet_infrastructure.repository.schedule_repository'
            - '@vimeet_infrastructure.repository.meeting_repository'
            - '@vimeet_infrastructure.repository.unavailability_repository'
            - '@vimeet_infrastructure.repository.happening_repository'
            - '@vimeet_infrastructure.repository.happening_participation_repository'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
            - '@vimeet_infrastructure.application.components.sheet.participant_info_guesser'

    #
    # Meeting Component
    #
    vimeet_infrastructure.application.components.meeting.request_views_builder:
        class: Proximum\Vimeet\Application\Components\Meeting\RequestViewsBuilder
        arguments:
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
            - '@vimeet_infrastructure.application.components.sheet.participant_info_guesser'

    #
    # DateTime
    #
    datetime:
        class: DateTimeImmutable
