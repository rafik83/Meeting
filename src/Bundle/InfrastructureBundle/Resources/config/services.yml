services:
    #
    # Event
    #
    vimeet_infrastructure.adapter.delayed_event_dispatcher:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Adapter\DelayedEventDispatcher
        arguments:
            - '@event_dispatcher'
        tags:
            - { name: kernel.event_listener, event: kernel.terminate, method: process }

    #
    # Repositories
    #
    vimeet_infrastructure.repository.event_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\EventRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.type_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\TypeRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet.components.paginator'
    vimeet_infrastructure.repository.category_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\CategoryRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet.components.paginator'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.repository.user_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\UserRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.participant_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\ParticipantRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.sheet_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\SheetRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet.components.paginator'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.repository.spot_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\SpotRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet_infrastructure.repository.type_repository'
    vimeet_infrastructure.repository.rule_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\RuleRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.nomenclature_item_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\NomenclatureItemRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.schedule_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\ScheduleRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.unavailability_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\UnavailabilityRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    repository.user.forgotten_password_token_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\User\ForgottenPasswordTokenRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    repository.admin.forgotten_password_token_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\Admin\ForgottenPasswordTokenRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.meeting.request_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\Meeting\RequestRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet.components.paginator'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
    vimeet_infrastructure.repository.happening_repository:
        class: Proximum\Vimeet\Bundle\InfrastructureBundle\Repository\HappeningRepository
