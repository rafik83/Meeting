Proximum\Vimeet\Application\Command\Unavailability\Add:
    constraints:
        - Expression:
            expression: "this.from < this.to"
            message: "validators.constraint.daterange"
    properties:
        from:
            - NotBlank: ~
            - DateTime: ~
        to:
            - NotBlank: ~
            - DateTime: ~
        participants:
            - NotBlank: ~
            - Count:
                min: 1
                minMessage: Vous devez choisir au moins {{ limit }} participant
            - All:
                - Type: { type: object }
