Proximum\Vimeet\Application\Command\Admin\ChangePassword:
    properties:
        currentPassword:
            - NotBlank: ~
            - Symfony\Component\Security\Core\Validator\Constraints\UserPassword:
                message: validators.currentPassword
        plainPassword:
            - NotBlank: ~
            - Length:
                min: 8
                minMessage: validators.password.min
