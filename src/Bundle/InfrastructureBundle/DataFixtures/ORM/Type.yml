                    en: "Brand"
                linkTo:
                    template: "packageTemplate"
                    index: 2
            -
                title:
                    fr: "Société"
                    en: "Company"
                template:
                    - { "type": "lib_text", "required": false, "private": false, "label": { "fr": "Nom", "en": "Name" } }
                    - { "type": "lib_text", "required": false, "private": false, "label": { "fr": "Adresse", "en": "Address" } }
