                                    en: "I do not take"
                                description: { "fr": "", "en": "" }
                                unitPrice: 0
                    -
                        type: "lib_text"
                        required: false
                        label:
                            fr: "Lien sur le logo vers votre site internet"
                            en: "Link on the brand"
                        description: { "fr": "", "en": "" }
                    -
                        label:
                            fr: "Pack Pub"
                            en: "Ads banner"
                        description:
                            fr: "Publicité + logo sur votre fiche de présentation en ligne."
                            en: "Description in english"
                        type: "upload_with_choices"
                        required: true
                        choices:
                            -
                                label:
                                    fr: "Formule 1"
                                    en: "Formula 1"
                                description:
                                    fr: ""
                                    en: ""
                                unitPrice: 199
                            -
                                label:
                                    fr: "Formule 2"
                                    en: "Formula 2"
                                description:
                                    fr: ""
                                    en: ""
                                unitPrice: 249
                            -
                                label:
                                    fr: "Formule 3"
                                    en: "Formula 3"
                                description:
                                    fr: ""
                                    en: ""
                                unitPrice: 399
                            -
                                label:
                                    fr: "Je ne prends pas"
                                    en: "I do not take"
                                description:
                                    fr: ""
                                    en: ""
                                unitPrice: 0
                    -
                        type: "lib_text"
                        required: false
                        label:
                            fr: "Lien sur la bannière pub vers votre site internet"
                            en: "Link on the ads banner"
                        description:
                            fr: "Module équipé de 4m² supplémentaires"
                            en: "Additional equipped booth of 4 sqm"
                        description:
                            fr: ""
                            en: ""
                        type: "lib_option"
                        unitPrice: 3990
                        quantity:
                            min: 1
                            max: 5
                    -
                        label:
                            fr: 'La mise en avant de votre entreprise au centre d’un e-mailing de promotion générale des Rendez-vous CARNOT dans la rubrique "Zoom sur"'
                            en: 'The highlighting of your company in an e-mailing promoting Rendez-vous Carnot in the heading "zoom on"'
                        description:
                            fr: "Quantité min 3, quantité max 3"
                            en: "Quantité min 3, quantité max 3"
                        type: "lib_option"
                        unitPrice: 5990
                        quantity:
                            min: 3
                            max: 3
                    -
                        label:
                            fr: "Option payant avec sélection de quantité"
                            en: "Option payant avec sélection de quantité"
                        description:
                            fr: "Quantité min 1, quantité max 5"
                            en: "Quantité min 1, quantité max 5"
                        type: "lib_option"
                        unitPrice: 11000
                        quantity:
                            min: 1
                            max: 5
            -
                title:
                    en: 'Options supplémentaires'
                    fr: 'Options supplémentaires'
                description:
                    en: 'ceci est une description'
                    fr: 'ceci est une description'
                template:
                    -
                        label:
                            fr: ' Wifi sur place'
                            en: ' Wifi sur place'
                        description:
                            fr: ''
                            en: ''
                        type: "lib_option"
                        unitPrice: 0
                    -
                        label:
                            fr: 'traduction de votre fiche de présentation'
                            en: 'traduction de votre fiche de présentation'
                        description:
                            en: ''
                            fr: ''
                        unitPrice: 95
                        type: "lib_option"
                        quantity:
                            min: 1
                            max: 5
                    -
                        label:
                            fr: 'Insertion de votre brochure dans les pochettes d’accueil'
                            en: 'Insertion de votre brochure dans les pochettes d’accueil'
                        description:
                            en: ''
                            fr: ''
                        unitPrice: 2600
                        type: "lib_option"
        previewTemplate: >
            <div>
                <h1>{{ sheet.data[0][0] }}</h1>
                <p>{{ sheet.data[0][3] }}</p>
            </div>

