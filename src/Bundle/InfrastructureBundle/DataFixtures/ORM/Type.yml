                            en: "Description package en"
                        type: "choice_with_description"
                        required: true
                        choices:
                            -
                                label:
                                    fr: "Formule Exposant"
                                    en: "Exhibitors package"
                                description:
                                    fr: >
                                        Votre inscription aux Rendez-vous CARNOT comprend les prestations suivantes (valables pour 1 personne) :
                                           - La publication de votre profil dans le catalogue envoyé aux participants par e-mail.
                                           - L’accès au catalogue en ligne comprenant les « fiches de présentation » de chaque participant pour faire vos choix de rendez-vous.
                                           - L’ouverture de votre « Espace Client » sur notre site internet.
                                           - L’assistance logistique de notre équipe avant et pendant le salon.
                                           - Un planning de rendez-vous préprogrammés sur 2 jours.
                                           - Votre stand équipé de 4 m² (2 x 2 m) comprenant votre enseigne, un rail de 2 spots lumineux, une table, 4 chaises, moquette et une prise électrique.
                                           - L’accès gratuit aux conférences, ateliers thématiques et tables rondes.
                                           - L’accès à la pause café permanente propice au contact informel.
                                           - Une invitation au cocktail inaugural.
                                    en: "Description Exhibitors"
                                unitPrice: 2190
                            -
                                label:
                                    fr: "Formule Découverte"
                                    en: "Discovery formula"
                                description:
                                    fr: "Description forfait Découverte"
                                    en: "Description Discovery"
                                unitPrice: 1090
                            -
                                label:
                                    fr: "Forfait Silver"
                                    en: "Silver formula"
                                description:
                                    fr: "Description forfait  Silver"
                                    en: "Description Silver"
                                unitPrice: 3990
                            -
                                label:
                                    fr: "Forfait Gold"
                                    en: "Gold formula"
                                description:
                                    fr: "Description forfait  Gold"
                                    en: "Description Gold"
                                unitPrice: 5990
                            -
                                label:
                                    fr: "Formule de sponsoring des CONFERENCES"
                                    en: "Sponsoring formula for CONFERENCES"
                                description:
                                    fr: "Description forfait  sponsoring"
                                    en: "Description sponsoring"
                                unitPrice: 11000
