            - { "type": "lib_text", "required": true, "private": false, "label": { "fr": "Prénom", "en": "Firstname" } }
            - { "type": "lib_text", "required": true, "private": true, "label": { "fr": "Téléphone", "en": "Phone" } }
            - { "type": "lib_text", "required": true, "private": false, "label": { "fr": "Fonction", "en": "Position" } }
