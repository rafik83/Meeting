                                    "label": { "fr": "Forfait Silver", "en": "Silver formula" },
                                    "description": { "fr": "Description forfait  Silver", "en": "Description Silver" },
                                    "unitPrice": 3990
                                },
                                {
                                    "label": { "fr": "Forfait Gold", "en": "Gold formula" },
                                    "description": { "fr": "Description forfait  Gold", "en": "Description Gold" },
                                    "unitPrice": 5990
                                },
                                {
                                    "label": { "fr": "Formule de sponsoring des CONFERENCES", "en": "Sponsoring formula for CONFERENCES" },
                                    "description": { "fr": "Description forfait  sponsoring", "en": "Description sponsoring" },
                                    "unitPrice": 11000
                                }
                            ]
                        }
                    ]
                }
