Proximum\Vimeet\Domain\Model\User:
    mr_user{1..100}:
        __construct: false
        email: <safeEmail()>
        salt: ""
        password: ""
        locale: "fr"

Proximum\Vimeet\Domain\Model\Sheet:
    mr_sheet_exhibitor{1..100}:
        __construct: false
        type: '@type_exposant'
        event: '@event_rdv_carnot_2016'
        data:
            563cae566af03:
                563cb103926e6: <company()>
        createdAt: <dateTime()>
        lastLoginAt: <dateTime()>

Proximum\Vimeet\Domain\Model\Participant:
    mr_participant{1..100}:
        __construct: false
        user: '@mr_user<current()>'
        sheet: '@mr_sheet_exhibitor<current()>'
        owner: true
        active: true
        data:
            563caf1d9b1cb: <lastName()>
            563caf2746398: <firstName()>

