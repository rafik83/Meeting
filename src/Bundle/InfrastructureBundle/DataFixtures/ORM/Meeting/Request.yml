Proximum\Vimeet\Domain\Model\Meeting\Request:
    meeting_request{1..20}:
        __construct: false
        description: <text(100)>
        from: @sheet_test
        to: @sheet_exposant<biasedNumberBetween($min = 1, $max = 20, $function = 'sqrt')>
        fromParticipants: [@participant_test]
        state: <randomElement($array = array ('SENT', 'APPR', 'REFU'))>
        createdAt: <dateTime($max = 'now')>
