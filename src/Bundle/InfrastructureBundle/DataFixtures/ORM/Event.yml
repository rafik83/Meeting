Proximum\Vimeet\Domain\Model\Event:
    event_rdv_carnot_2016:
        title: Les rendez-vous CARNOT 2016
        domain: rdv-carnot-2016.<domain()>
        locales: [fr, en]
        fallback: fr
        billingTemplate:
            - { "type": "lib_text", "required": true, "label": { "fr": "Nom", "en": "Name" } }
            - { "type": "lib_text", "required": false, "label": { "fr": "Téléphone", "en": "Phone" } }
            - { "type": "lib_text", "required": true, "label": { "fr": "Email", "en": "Email" } }
            - { "type": "lib_text", "required": true, "label": { "fr": "Raison sociale", "en": "Company" } }
            - { "type": "lib_text", "required": true, "label": { "fr": "Adresse", "en": "Address" } }
            - { "type": "lib_text", "required": true, "label": { "fr": "Code postal", "en": "Zip code" } }
            - { "type": "lib_text", "required": true, "label": { "fr": "Ville", "en": "City" } }
            - { "type": "lib_country", "required": true, "label": { "fr": "Pays", "en": "Country" } }
            - { "type": "lib_text", "required": false, "label": { "fr": "N° de TVA intracommunautaire", "en": "N° VAT" } }

Proximum\Vimeet\Domain\Model\EventTranslation:
    event_translation_rdv_carnot_2016_fr:
        description: LES RENDEZ-VOUS DE LA R&D POUR LES ENTREPRISES
        locale: fr
        event: @event_rdv_carnot_2016
    event_translation_rdv_carnot_2016_en:
        description: In 7 editions, les Rendez-vous CARNOT became the major R&D event for innovation.
        locale: en
        event: @event_rdv_carnot_2016
