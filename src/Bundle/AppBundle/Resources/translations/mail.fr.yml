mail:
    activateAccount:
        subject: '[%event%] Activer votre compte'
        body: >
            Bonjour,
            Vous avez été invité en tant que participant pour l'événement %event%
            Pour y accéder, cliquer sur le lien suivant et entrer un mot de passe pour activer votre compte:
        end: >
            Cordialement,
            L'équipe Vimeet
