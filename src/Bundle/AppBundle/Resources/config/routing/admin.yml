#
# Event
#

admin_event_list:
    path: /event
    methods: [GET]
    defaults: { _controller: VimeetAppBundle:Admin/Event:list }

admin_event_update:
    path: /event/{id}/update
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Event:update }

admin_event_who_see_who:
    path: /event/{id}/who-see-who
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Event:whoSeeWho }

admin_event_who_see_who_delete:
    path: /event/{id}/who-see-who/{see_id}/delete
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Event:deleteSee }

#
# Type
#

admin_type_list:
    path: /type
    methods: [GET]
    defaults: { _controller: VimeetAppBundle:Admin/Type:list }

admin_type_update:
    path: /type/{id}/update
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Type:update }
