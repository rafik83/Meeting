admin_sheet_transaction_create:
    path: /sheet/{id}/transaction/create
    requirements:
        id: \d+
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Transaction:create }
admin_sheet_transaction_update:
    path: /sheet/{id}/transaction/{transaction_id}/update
    requirements:
        id: \d+
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Transaction:update }
admin_sheet_transaction_remove:
    path: /sheet/{id}/transaction/{transaction_id}/remove
    requirements:
        id: \d+
    methods: [DELETE]
    defaults: { _controller: VimeetAppBundle:Admin/Transaction:remove }
