#
# Sheet
#
admin_sheet:
    path: /event/{id}/sheet
    requirements:
        id: \d+
    methods: [GET]
    defaults: { _controller: VimeetAppBundle:Admin/Sheet:list }

#
# Billing
#
admin_sheet_billing:
    path: /event/{id}/sheet/{sheet_id}/billing
    requirements:
        id: \d+
        sheet_id: \d+
    methods: [GET]
    defaults: { _controller: VimeetAppBundle:Admin/Billing:list }

#
# Order
#
admin_sheet_order_edit:
    path: /order/{id}/edit
    requirements:
        id: \d+
    methods: [GET]
    defaults: { _controller: VimeetAppBundle:Admin/Order:edit }
admin_sheet_order_add_row:
    path: /order/{id}/group/{group}/row/add
    requirements:
        id: \d+
        group: '[a-zA-Z0-9\-]+'
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Order:addRow }
admin_sheet_order_remove_row:
    path: /order/{id}/group/{group}/row/{row}/remove
    requirements:
        id: \d+
        group: '[a-zA-Z0-9\-]+'
        row: '[a-zA-Z0-9\-]+'
    methods: [DELETE]
    defaults: { _controller: VimeetAppBundle:Admin/Order:removeRow }
admin_sheet_order_update_row:
    path: /order/{id}/group/{group}/row/{row}/update
    requirements:
        id: \d+
        group: '[a-zA-Z0-9\-]+'
        row: '[a-zA-Z0-9\-]+'
    methods: [GET, POST]
    defaults: { _controller: VimeetAppBundle:Admin/Order:updateRow }

#
# Transaction
