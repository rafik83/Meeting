    defaults: { _controller: VimeetAppBundle:Event/Sheet:sheet }

event_sheet_add_participant:
    path: /sheet/{id}/add_participant
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Sheet:addParticipant }

event_sheet_update_participant:
    path: /sheet/{id}/update_participant/{participant_id}
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Sheet:updateParticipant }

event_sheet_update_block:
