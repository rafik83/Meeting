    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [DELETE]
    defaults: { _controller: VimeetAppBundle:Event/Sheet:deleteParticipant }

event_sheet_package_update_step:
