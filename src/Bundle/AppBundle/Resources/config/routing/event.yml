#
# Event home
#

event:
    path: /
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Home:index }

#
# Register
#

event_register:
    path: /register/{typeView}
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Home:register }

#
# Forgot password
#

event_forgotten_password:
    path: /forgotten_password
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/ForgottenPassword:forgottenPassword }

event_create_new_password:
    path: /reset_password/{token}
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/ForgottenPassword:createNewPassword }

#
# Join event
#

event_participate:
    path: /participate/{typeView}
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Home:participate }

#
