event_sheet_schedule_meeting_update:
    path: /sheet/{id}/meeting/{meeting}/update
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
        id: \d+
        meeting: \d+
