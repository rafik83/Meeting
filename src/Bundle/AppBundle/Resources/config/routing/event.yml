event:
    path: /
    host: "{subdomain}.%domain%"
    requirements:
        subdomain: "[a-zA-Z0-9\-]+"
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Home:index }

event_register:
    path: /register/{typeView}
    host: "{subdomain}.%domain%"
    requirements:
        subdomain: "[a-zA-Z0-9\-]+"
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Home:register }

event_participate:
    path: /participate/{typeView}
    host: "{subdomain}.%domain%"
    requirements:
        subdomain: "[a-zA-Z0-9\-]+"
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Home:participate }

event_sheet:
    path: /sheet/{id}
    host: "{subdomain}.%domain%"
    requirements:
        subdomain: "[a-zA-Z0-9\-]+"
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Sheet:sheet }

event_sheet_add_participant:
    path: /sheet/{id}/add_participant
    host: "{subdomain}.%domain%"
    requirements:
        subdomain: "[a-zA-Z0-9\-]+"
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/Sheet:addParticipant }

event_sheet_update_participant:
