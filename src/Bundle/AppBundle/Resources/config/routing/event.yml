    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Order:summary }

event_sheet_order_pro_forma:
    path: /sheet/{id}/pro_forma/{order_id}
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Order:proforma }

#
# Authentication
#

event_login:
    path: /login
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Security:login }

event_login_check:
    path: /login_check
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [POST]

event_logout_confirmation:
    path: /logout-confirmation
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Security:logoutConfirmation }

event_logout:
    path: /logout
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]

event_change_password:
    path: /change-password
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/ChangePassword:changePassword }

#
# Catalog
#

event_catalog:
    path: /catalog
    host: '{subdomain}.%domain%'
    requirements:
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Catalog:categories }

event_catalog_category:
    path: /catalog/{categoryView}
    host: '{subdomain}.%domain%'
    requirements:
        categoryView: \d+
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Catalog:category }

event_catalog_sheet:
    path: /catalog/{categoryView}/sheet/{id}
    host: '{subdomain}.%domain%'
    requirements:
        categoryView: \d+
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event/Catalog:sheet }

event_catalog_sheet_meeting_request:
    path: /catalog/{categoryView}/sheet/{id}/meeting/request/from/{from}
    host: '{subdomain}.%domain%'
    requirements:
        categoryView: \d+
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/MeetingRequest:createRequest }

