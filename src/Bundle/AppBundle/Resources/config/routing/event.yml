    host: '{subdomain}.%domain%'
    requirements:
        id: \d+
        meetingRequest: \d+
        subdomain: '[a-zA-Z0-9\-]+'
    methods:  [GET, POST]
    defaults: { _controller: VimeetAppBundle:Event/MeetingRequest:refusedRequest }
