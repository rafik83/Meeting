vimeet_app_homepage:
    path:     /hello/{name}
    defaults: { _controller: VimeetAppBundle:Default:index }
    methods:  [GET]

event:
    path: /
    host: "{subdomain}.%domain%"
    requirements:
        subdomain: "[a-zA-Z0-9\-]+"
    methods:  [GET]
    defaults: { _controller: VimeetAppBundle:Event:index }
