#
# Event home
#

event:
    path: /
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Home:index }

#
# Register
#

event_register:
    path: /register/{typeView}
    methods:  [GET, POST]
    requirements:
        typeView: \d+
    defaults: { _controller: EventBundle:Register:register }

event_register_new_user:
    path: /register/{typeView}/new
    methods:  [GET, POST]
    requirements:
        typeView: \d+
    defaults: { _controller: EventBundle:Register:registerNewUser }

#
# Change mail
#
event_account_change_mail:
    path: /account/change-mail
    methods: [GET, POST]
    defaults: { _controller: EventBundle:Account:updateEmail }

event_activate_new_mail:
    path: /account/change_mail/{token}
    methods: [GET]
    requirements:
        token: \w+
    defaults: { _controller: EventBundle:Account:activateNewMail }

#
# Forgot password
#

event_forgotten_password:
    path: /forgotten_password
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:ForgottenPassword:forgottenPassword }

event_forgotten_password_confirm:
    path: /forgotten_password/confirm
    methods:  [GET]
    defaults: { _controller: EventBundle:ForgottenPassword:forgottenPasswordConfirm }

event_create_new_password:
    path: /reset_password/{token}
    methods:  [GET, POST]
    requirements:
        token: \w+
    defaults: { _controller: EventBundle:ForgottenPassword:createNewPassword }

#
# Activate account
#

event_activate_account:
    path: /activate/{token}
    methods: [GET, POST]
    requirements:
        token: \w+
    defaults: { _controller: EventBundle:ActivateAccount:password }

event_activate_account_already_known:
    path: /complete-profile/{participant}
    methods: [GET]
    requirements:
        participant: \d+
    defaults: { _controller: EventBundle:ActivateAccount:completeProfile }

#
# Join event
#

event_participate:
    path: /participate/{typeView}
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Register:participate }

event_participant_step:
    path: /participant/{participant}/step/{step}
    methods: [GET, POST]
    requirements:
        participant: \d+
        step: \d+
    defaults: { _controller: EventBundle:Register:participantStep }

#
# Profil
#

event_account_participant:
    path: /account/sheet/{sheet}/participant/{participant}
    methods: [GET]
    requirements:
        sheet: \d+
        participant: \d+
    defaults: { _controller: EventBundle:Participant:see }

event_account_participant_profile:
    path: /account/sheet/{sheet}/participant/{participant}/profile
    methods: [GET, POST]
    requirements:
        sheet: \d+
        participant: \d+
    defaults: { _controller: EventBundle:Participant:updateProfile }

event_account_participant_company:
    path: /account/sheet/{sheet}/company
    methods: [GET, POST]
    requirements:
        sheet: \d+
    defaults: { _controller: EventBundle:Participant:updateCompany }

event_account_participant_avatar:
    path: /account/sheet/{sheet}/participant/{participant}/avatar/{key}
    methods: [GET, POST]
    requirements:
        sheet: \d+
        participant: \d+
        key: \w+
    defaults: { _controller: EventBundle:Participant:updateAvatar }

#
# Sheet
#

event_sheet:
    path:     /sheet
    methods:  [GET]
    defaults: { _controller: EventBundle:Sheet:sheet }

event_sheet_locale:
    path:     /sheet/{locale}
    requirements:
        locale: '[a-z]{2}'
    methods:  [GET]
    defaults: { _controller: EventBundle:Sheet:sheet }

event_sheet_form:
    path:     /sheet/{locale}/{key}/form
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods:  [GET]
    defaults: { _controller: EventBundle:Sheet:form }
event_sheet_update:
    path:     /sheet/{locale}/{key}
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Sheet:update }

event_sheet_add_participant:
    path:   /sheet/{locale}/{key}/participant/add/form
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods:  [GET]
    defaults: { _controller: EventBundle:Sheet:addParticipant }

event_sheet_handle_participant:
    path:   /sheet/{locale}/{key}/participant/add
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Sheet:handleAddParticipant }

event_sheet_remove_participant:
    path:   /sheet/{locale}/{key}/participant/remove/form
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods:  [GET]
    defaults: { _controller: EventBundle:Sheet:removeParticipant }

event_sheet_remove_image:
    path: /sheet/{locale}/{key}/image/remove
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods: [DELETE]
    defaults: { _controller: EventBundle:Sheet:removeImage }

event_sheet_handle_remove_participant:
    path:   /sheet/{locale}/{key}/participant/remove
    requirements:
        locale: '[a-z]{2}'
        key: \w+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Sheet:handleRemoveParticipant }

#
# Sheet Billing
#

event_billing_info:
    path:     /sheet/{sheet}/billing-info
    methods:  [GET, POST]
    requirements:
        sheet: \d+
    defaults: { _controller: EventBundle:Billing:info }

event_billing_info_clear_flash:
    path:     /sheet/{sheet}/billing-info-from-menu
    methods:  [GET, POST]
    requirements:
        sheet: \d+
    defaults: { _controller: EventBundle:Billing:infoClearFlash }
#
# Authentication
#

event_login:
    path:     /login
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Security:loginFirstStep }

event_login_second_step:
    path:     /login-second-step
    methods:  [GET]
    defaults: { _controller: EventBundle:Security:loginSecondStep }

event_login_check:
    path:     /login_check
    methods:  [POST]

event_logout_confirmation:
    path:     /logout-confirmation
    methods:  [GET]
    defaults: { _controller: EventBundle:Security:logoutConfirmation }

event_logout:
    path:     /logout
    methods:  [GET]

event_change_password:
    path:     /change-password
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:ChangePassword:changePassword }

#
# Catalog
#

event_catalog_index:
    path: /catalog
    methods:  [GET]
    defaults: { _controller: EventBundle:Catalog:index }

event_catalog_complete_sheet:
    path: /catalog/sheet/{sheet}
    requirements:
        sheet: \d+
    methods: [GET, POST]
    defaults: { _controller: EventBundle:Catalog:sheet}

event_catalog_sheet_meeting_request:
    path: /catalog/sheet/{to}/meeting/request/from/{from}
    requirements:
        to: \d+
        from: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:MeetingRequest:createRequest }

#
# Schedule
#

event_sheet_schedule:
    path: /sheet/{sheet}/schedule
    requirements:
        sheet: \d+
    methods:  [GET]
    defaults: { _controller: EventBundle:Schedule:display }

event_sheet_schedule_add_unavailability:
    path: /sheet/{sheet}/schedule/unavailability/add
    requirements:
        sheet: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Schedule:addUnavailability }

event_sheet_schedule_update_unavailability:
    path: /sheet/{sheet}/schedule/unavailability/{unavailability}/update
    requirements:
        sheet: \d+
        unavailability: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Schedule:updateUnavailability }

event_sheet_schedule_remove_unavailability:
    path: /sheet/{sheet}/schedule/unavailability/{unavailability}/remove
    requirements:
        sheet: \d+
        unavailability: \d+
    methods:  [DELETE]
    defaults: { _controller: EventBundle:Schedule:removeUnavailability }

event_sheet_schedule_participate_happening:
    path: /sheet/{sheet}/happening/{happening}/participate
    requirements:
        sheet: \d+
        happening: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Schedule:participateHappening }

event_sheet_schedule_unparticipate_happening:
    path: /sheet/{sheet}/happening/{happening}/unparticipate/{participant}
    requirements:
        sheet: \d+
        happening: \d+
        participant: \d+
    methods:  [POST]
    defaults: { _controller: EventBundle:Schedule:unparticipateHappening }

#
# Meeting
#

event_sheet_schedule_meeting:
    path: /sheet/{sheet}/meeting/{meeting}
    requirements:
        sheet: \d+
        meeting: \d+
    methods:  [GET]
    defaults: { _controller: EventBundle:Meeting:display }

event_sheet_schedule_meeting_cancel:
    path: /sheet/{sheet}/meeting/{meeting}/cancel
    requirements:
        sheet: \d+
        meeting: \d+
    methods:  [GET, DELETE]
    defaults: { _controller: EventBundle:Meeting:cancel }

event_sheet_schedule_meeting_update:
    path: /sheet/{sheet}/meeting/{meeting}/update
    requirements:
        sheet: \d+
        meeting: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:Meeting:update }

#
# Meeting Request
#
event_meeting_list_request:
    path: /sheet/{sheet}/meeting/request
    requirements:
        sheet: \d+
    methods:  [GET]
    defaults: { _controller: EventBundle:MeetingRequest:listRequest }

event_meeting_list_proposition:
    path: /sheet/{sheet}/meeting/proposition
    requirements:
        sheet: \d+
    methods:  [GET]
    defaults: { _controller: EventBundle:MeetingRequest:listProposition }

event_meeting_request_approve:
    path: /sheet/{sheet}/meeting/request/{meetingRequest}/approve
    requirements:
        sheet: \d+
        meetingRequest: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:MeetingRequest:approveRequest }

event_meeting_request_refuse:
    path: /sheet/{sheet}/meeting/request/{meetingRequest}/refuse
    requirements:
        sheet: \d+
        meetingRequest: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:MeetingRequest:refuseRequest }

event_meeting_request_cancel:
    path: /sheet/{sheet}/meeting/request/{meetingRequest}/cancel
    requirements:
        sheet: \d+
        meetingRequest: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:MeetingRequest:cancelRequest }

event_meeting_request_show:
    path: /sheet/{sheet}/meeting/request/{meetingRequest}
    requirements:
        sheet: \d+
        meetingRequest: \d+
    methods:  [GET]
    defaults: { _controller: EventBundle:MeetingRequest:showRequest }

event_meeting_request_edit:
    path: /sheet/{sheet}/meeting/request/{meetingRequest}/edit
    requirements:
        sheet: \d+
        meetingRequest: \d+
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:MeetingRequest:editRequest }

#
# Notification
#
event_notification_list:
    path:     /notification
    methods:  [GET]
    defaults: { _controller: EventBundle:Notification:list }

event_notification_read:
    path:     /notification/{notification}/read
    requirements:
        notification: \d+
    methods:  [GET]
    defaults: { _controller: EventBundle:Notification:read }

#
# Content
#
event_content_terms_of_sale:
    path: /terms-of-sale
    defaults: { _controller: EventBundle:Content:termsOfSale }
    methods: [GET]

#
# Package
#
event_package:
    path: /package
    defaults: { _controller: EventBundle:Package:redirect }
    methods: [GET]

event_package_step:
    path: /sheet/{sheet}/package/step/{step}
    defaults: { _controller: EventBundle:Package:step }
    requirements:
        sheet: \d+
        step: \d+
    methods:  [GET, POST]

event_package_add_participant:
    path: /sheet/{sheet}/package/step/{step}/participant/add
    defaults: { _controller: EventBundle:Package:addParticipant }
    requirements:
        sheet: \d+
        step: \d+
    methods:  [GET]

event_package_remove_participant:
    path: /sheet/{sheet}/package/step/{step}/participant/remove
    defaults: { _controller: EventBundle:Package:removeParticipant }
    requirements:
        sheet: \d+
        step: \d+
    methods:  [GET]

event_package_summary:
    path: /sheet/{sheet}/package/summary
    defaults: { _controller: EventBundle:Package:summary }
    requirements:
        sheet: \d+
        step: \d+
    methods: [GET, POST]

event_package_summary_fill_billing_info:
    path: /sheet/{sheet}/package/summary/fill-billing-info
    defaults: { _controller: EventBundle:Package:fillBillingInfo }
    requirements:
        sheet: \d+
    methods: [GET]

event_package_remove_promotion_code:
    path: /sheet/{sheet}/package/promotion/{promotion}/remove
    requirements:
        sheet: \d+
        promotion: \d+
    methods: [DELETE]
    defaults: { _controller: EventBundle:Package:removePromotionCode }

event_package_payment:
    path: /sheet/{sheet}/package/payment
    requirements:
        sheet: \d+
    methods: [GET, POST]
    defaults: { _controller: EventBundle:Payment:paymentChoice }

event_package_payment_prepare_paypal:
    path: /sheet/{sheet}/package/payment/paypal/{transaction}
    requirements:
        sheet: \d+
        transaction: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Payment:preparePaypal }

event_package_payment_done:
    path: /sheet/{sheet}/package/payment/done
    requirements:
        sheet: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Payment:donePayment }

event_package_payment_pay_remaining:
    path: /sheet/{sheet}/package/payment/pay-remaining
    requirements:
        sheet: \d+
        transaction: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Payment:payRemaining }

create_transaction:
    path: /sheet/{sheet}/create-transaction
    requirements:
        sheet: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Payment:createTempTransaction }

event_payment_info:
    path: /sheet/payment
    methods: [GET]
    defaults: { _controller: EventBundle:Payment:paymentInfo }

#
# Order
#
event_order_list:
    path: /sheet/{sheet}/orders
    requirements:
        sheet: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Order:list }

event_pro_forma:
    path: /sheet/{sheet}/order/{order}/pro-forma
    requirements:
        sheet: \d+
        order: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Order:proForma }

event_order_summary_total:
    path: /sheet/{sheet}/order/summary
    requirements:
        sheet: \d+
    methods: [GET]
    defaults: { _controller: EventBundle:Order:summaryTotal }
