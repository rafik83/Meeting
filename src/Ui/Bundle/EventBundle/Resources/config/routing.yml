        sheet: \d+
    methods: [GET, POST]
    defaults: { _controller: EventBundle:Account:updateEmail }

event_activate_new_mail:
    path: /account/change_mail/{token}
    requirements:
        token: \w+
    methods: [GET]
    defaults: { _controller: EventBundle:Account:activateNewMail }

#
# Forgot password
#

event_forgotten_password:
    path: /forgotten_password
    methods:  [GET, POST]
    defaults: { _controller: EventBundle:ForgottenPassword:forgottenPassword }

event_forgotten_password_confirm:
    path: /forgotten_password/confirm
    methods:  [GET]
    defaults: { _controller: EventBundle:ForgottenPassword:forgottenPasswordConfirm }

