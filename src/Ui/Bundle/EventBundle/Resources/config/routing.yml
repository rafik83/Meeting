#
# Event home
#

event:
    path: /
    methods:  [GET, POST]
    controller: Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\HomeAction

event_registration_path_question:
    path: /question/{question}
    methods:  [GET, POST]
    controller: Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\HomeAction
    requirements:
        question: \d+

event_registration_path_answer:
    path: /question/{question}/answer/{answer}
    methods:  [GET, POST]
    controller: Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\HomeAction
    requirements:
        question: \d+
        answer: \d+

event_select_sheet:
    path: /select-sheet
    methods:  [GET]
    defaults: { _controller: EventBundle:MultipleSheets/Home:selectSheet }

event_multiplesheets_request_list:
    path: /multiplesheets/request/list
    methods:  [GET]
    defaults: { _controller: EventBundle:MultipleSheets/Request:list }

event_waiting_page:
