    methods: [GET]
    defaults: { _controller: EventBundle:Waiting:index }

#
# Register
#

event_register:
    path: /register/{typeView}
    methods:  [GET, POST]
    requirements:
        typeView: \d+
    defaults: { _controller: EventBundle:Register:register }

event_prefill_register:
    path: /prefill-register/{typeView}
    methods:  [GET]
    requirements:
        typeView: \d+
    defaults: { _controller: EventBundle:Register:prefillRegister }

