services:
    #
    # Params converters
    #
    vimeet_app.param_converter.event_domain_param_converter:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\ParamConverter\EventDomainParamConverter
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
        tags:
            - { name: 'request.param_converter', priority: -1, converter: 'event_domain_param_converter' }
    vimeet_app.param_converter.participant_type_view_param_converter:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\ParamConverter\TypeViewParamConverter
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
        tags:
            - { name: 'request.param_converter', priority: 2, converter: 'participant_type_view_param_converter' }
    vimeet_app.param_converter.category_view_param_converter:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\ParamConverter\CategoryViewParamConverter
        arguments:
            - '@vimeet_infrastructure.repository.category_repository'
        tags:
            - { name: 'request.param_converter', priority: 2, converter: 'category_view_param_converter' }
    vimeet_app.param_converter.sheet_param_converter:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\ParamConverter\SheetParamConverter
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
        tags:
            - { name: 'request.param_converter', priority: 2, converter: 'sheet_param_converter' }

    #
    # Security
    #
    security.admin_event_access_voter:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Security\Voter\AdminEventAccessVoter
        arguments:
            - '@components.security.admin_event_access'
        tags:
            - { name: security.voter }
    security.admin_sheet_access_voter:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Security\Voter\AdminSheetAccessVoter
        arguments:
            - '@components.security.admin_sheet_access'
        tags:
            - { name: security.voter }

    #
    # Form extension
    #
    vimeet_app.form_extension.translation_domain_extension:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Form\Extension\TranslationDomainExtension
        tags:
            - { name: 'form.type_extension', extended_type: 'Symfony\Component\Form\Extension\Core\Type\FormType' }
    form_extension.select2:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Form\Extension\Select2Extension
        arguments:
            - '@translator'
        tags:
            - { name: 'form.type_extension', extended_type: 'Symfony\Component\Form\Extension\Core\Type\ChoiceType' }
    vimeet.form_extension.textarea_extension:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Form\Extension\TextareaExtension
        tags:
            - { name: form.type_extension, extended_type: 'Symfony\Component\Form\Extension\Core\Type\TextareaType' }

    #
    # Form type
    #
    vimeet_app.form_type_meeting.request_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Meeting\Request\MeetingRequestCreateType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_meeting.request_update_from_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Meeting\Request\MeetingRequestUpdateType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_participant.participant_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Participant\ParticipantChoiceType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: form.type }
    vimeet_app.form_type_participant.meeting_participant_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Participant\MeetingParticipantChoiceType
        arguments:
            - '@template.participant_info_guesser'
            - '@vimeet_infrastructure.repository.participant_repository'
        tags:
            - { name: form.type }
    vimeet_app.form_type_participant.participant_entity_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Participant\ParticipantEntityType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_participant.type_choice:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Type\TypeChoiceType
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
            - '@markdown'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_meeting.meeting_request_update_to_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Meeting\Request\MeetingRequestUpdateToType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: form.type }
    vimeet_app.form_type_meeting.approve_request_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Meeting\Request\MeetingRequestApproveType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_meeting.refuse_request_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Meeting\Request\MeetingRequestRefuseType
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_meeting.meeting_request_cancel_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Meeting\Request\MeetingRequestCancelType
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_sheet.block_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Sheet\BlockType
        tags:
            - { name: 'form.type' }
    form_type_sheet_data.image_data_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Sheet\Data\ImageDataType
        arguments:
            - '@transformer.product.id_to_product_transformer'
            - '@package.product.template_product_guesser'
            - '@buyable_object_resolver'
        tags:
            - { name: 'form.type' }
    form_type_sheet_data.media_collection_data_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Sheet\Data\MediaCollectionDataType
        arguments:
            - '@transformer.product.id_to_product_transformer'
            - '@package.product.template_product_guesser'
            - '@buyable_object_resolver'
        tags:
            - { name: 'form.type' }
    form_type_library.telephone_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Library\TelephoneType
        tags:
            - { name: 'form.type' }
    form_type_sheet_data.nomenclature_data_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Sheet\Data\NomenclatureDataType
        arguments:
            - '@repository.nomenclature_repository'
        tags:
            - { name: 'form.type' }
    form_type_sheet_data.editable_text_data_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Sheet\Data\EditableTextDataType
        arguments:
            - '@vimeet_infrastructure.adapter.translator_adapter'
        tags:
            - { name: form.type }
    form_type_package.participant_and_planning_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Package\ParticipantAndPlanningType
        arguments:
            - '@package.planning.quantity_max_guesser'
        tags:
            - { name: form.type }
    form_type_package.options_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Package\OptionsType
        arguments:
            - '@package.planning.quantity_max_guesser'
        tags:
            - { name: form.type }

    form_type_sheet_data.editable_text_input_data_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Sheet\Data\EditableTextInputDataType
        arguments:
            - '@vimeet_infrastructure.adapter.translator_adapter'
        tags:
            - { name: form.type }

    form_type.catalog_search_type:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Form\Type\Catalog\SearchType
        arguments:
            - '@query.catalog.search_facet_view_query_handler'
        tags:
            - { name: form.type }

    #
    # Event Listener
    #
    vimeet_app.domain_event_listener:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\DomainEventListener
        arguments:
            - '@router.default'
            - '@vimeet_infrastructure.repository.event_repository'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.request' }
    event_listener.login_event_listener:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\LoginEventListener
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@request_stack'
            - '@command.admin.update_last_login_handler'
            - '@doctrine.orm.entity_manager'
        tags:
            - { name: kernel.event_listener, event: security.authentication.success, method: onLoginSuccess }
    event_listener.registration_step_event_subscriber:
            class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\RegistrationStepEventSubscriber
            arguments:
                - '@components.registration.step_manager'
            tags:
                 - { name: kernel.event_subscriber }
    event_listener.mail_event_subscriber:
        class: Proximum\Vimeet\Ui\Bundle\MailBundle\EventListener\MailEventSubscriber
        arguments:
            - '@adapter.mailer_adapter'
            - '@event_sender'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.submit_sheet_mail_event_subscriber:
        class: Proximum\Vimeet\Ui\Bundle\MailBundle\EventListener\SubmitSheetMailEventSubscriber
        arguments:
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
            - '@template.participant_info_guesser'
            - '@repository.admin_repository'
            - '@adapter.mailer_adapter'
            - '%mailer_sender%'
            - '@datetime'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.trace_event_subscriber:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\TraceEventSubscriber
        arguments:
            - '@repository.trace_repository'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.sheet_validator_event_subscriber:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\SheetValidatorEventSubscriber
        arguments:
             - '@components.sheet.sheet_validator'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.sheet.sheet_updated_event_subscriber:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\Sheet\SheetUpdatedEventSubscriber
        arguments:
            - '@sheet.completeness_calculator'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.sheet.package_orders_updated_event_subscriber:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\Package\MustSelectPackageEventSubscriber
        arguments:
            - '@package.orders_checker'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.xhr_authentication_expired_exception_listener:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\XHRAuthenticationExpiredExceptionListener
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 250 }
    event_listener.sheet.sheet_populate_event_subscriber:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\Sheet\SheetPopulateEventSubscriber
        arguments:
            - '@fos_elastica.object_persister.app.sheet'
        tags:
            - { name: kernel.event_subscriber }
    event_listener.notification_event_subscriber:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\EventListener\Notification\NotificationEventSubscriber
        arguments:
            - '@vimeet_infrastructure.repository.notification_repository'
            - '@repository.transaction'
            - '@order.balance'
        tags:
            - { name: kernel.event_subscriber }

    #
    # Twig extension
    #
    vimeet_app.twig_extension:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Twig\AppExtension
        public: false
        arguments:
            - '@sonata.intl.templating.helper.locale'
        tags:
            - { name: 'twig.extension' }

    #
    # Security
    #
    security.impersonate:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Security\Impersonate\Impersonate
        arguments:
            - '@security.user.provider.concrete.admin_provider'
            - '@security.user.provider.concrete.user_provider'
            - '%secret%'

    security.authentication.switchuser_listener: # this service name must not be changed in order to override symfony default SwitchUserListener service
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Security\Http\Firewall\SwitchUserListener
        public: false
        abstract: true
        arguments:
            - '@security.token_storage'
            - ~
            - ~
            - ~
            - '@security.access.decision_manager'
            - '@?logger'
            - ~
            - ~
            - '@?event_dispatcher'
            - '@security.impersonate'
            - '@vimeet_infrastructure.repository.event_repository'
        tags:
            - { name: monolog.logger, channel: security }
    security.sheet_voter:
        class: Proximum\Vimeet\Ui\Bundle\EventBundle\Security\SheetVoter
        tags:
            - { name: security.voter }
        public: false
    security.app.user_checker:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Security\UserChecker
        arguments:
            - '@request_stack'
            - '@vimeet_infrastructure.repository.event_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@vimeet_infrastructure.repository.type_repository'
            - '@components.user.type_resolver'
            - '@session'

    #
    # Services
    #
    error_factory:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Service\ErrorFactory
        arguments:
            - '@translator'
            - '@request_stack'

    filter_summary:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Service\FilterSummary
        arguments:
            - '@translator'

    markdown:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Service\Markdown

    event_sender:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Service\EventSender
        arguments:
            - '%domain%'
            - '%mailer_sender%'


    #
    # Validators
    #
    validator.package.planning_quantity_validator:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Validator\Constraint\Package\PlanningQuantityValidator
        arguments:
            - '@package.planning.quantity_max_guesser'
            - '@package.planning.quantity_min_guesser'
        tags:
            - { name: validator.constraint_validator }
    validator.package.options_validator:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Validator\Constraint\Package\OptionsValidator
        arguments:
            - '@package.planning.quantity_max_guesser'
            - '@package.planning.quantity_min_guesser'
            - '@package.product.template_product_guesser'
            - '@datetime'
            - '@order.merger'
            - '@cart_manager'
        tags:
            - { name: validator.constraint_validator }
