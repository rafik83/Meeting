services:
    #
    # Form type
    #
    vimeet_app.form_type.who_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\WhoType
        arguments:
            - '@vimeet_infrastructure.repository.category_repository'
            - '@vimeet_infrastructure.repository.type_repository'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type_spot.spot_create_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Spot\SpotCreateType
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type.category_create_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Category\CategoryCreateType
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
        tags:
            - { name: 'form.type' }
    vimeet_app.form_type.category_update_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Category\CategoryUpdateType
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
        tags:
            - { name: 'form.type' }
    form_type.category_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\CategoryChoiceType
        arguments:
            - '@vimeet_infrastructure.repository.category_repository'
        tags:
            - { name: form.type }
    form_type.type_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\TypeChoiceType
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
        tags:
            - { name: form.type }
    form_type_.sheet.follower_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Sheet\FollowerChoiceType
        arguments:
            - '@repository.admin_repository'
        tags:
            - { name: form.type }
    form_type.event_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Event\EventChoiceType
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
        tags:
            - { name: form.type }
    form_type.admin_event_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Event\AdminEventChoiceType
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
        tags:
            - { name: form.type }
    form_type_template.sheet_template_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Template\SheetTemplateChoiceType
        arguments:
            - '@repository.template.sheet_template_repository'
        tags:
            - { name: form.type }
    form_type_sheet_template.organizer_create_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Sheet\Template\CreateForEventType
        tags:
            - { name: form.type }
    form_type_sheet_template.organizer_duplicate_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Sheet\Template\DuplicateForEventType
        tags:
            - { name: form.type }
    form_type_template_registration.update_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Template\Registration\UpdateType
        tags:
            - { name: form.type }
    form_type_library_admin.json_array_textarea_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Template\Registration\JsonArrayTextareaType
        tags:
            - { name: form.type }
    form_type_template.registration_template_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Template\RegistrationTemplateChoiceType
        arguments:
            - '@repository.template.registration_template_repository'
        tags:
            - { name: form.type }
    vimeet_app.form_type_meeting_request.meeting_request:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\MeetingRequest\PositionMeetingType
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: form.type }
    form_type_product.product_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Product\ProductChoiceType
        arguments:
            - '@vimeet_infrastructure.repository.product_repository'
            - '@ui.helper.currency_formatter'
        tags:
            - { name: form.type }
    form_type_package.package_choice_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Package\PackageChoiceType
        arguments:
            - '@repository.package_repository'
        tags:
            - { name: form.type }
    form_type_event.event_update_type:
        class: Proximum\Vimeet\Ui\Bundle\AdminBundle\Form\Type\Event\EventUpdateType
        arguments:
            - '%infrastructure.supported_currencies%'
        tags:
            - { name: form.type }

    #
    # Helper
    #
    ui.helper.currency_formatter:
        class: Proximum\Vimeet\Ui\Helper\CurrencyFormatter
        arguments:
            - '@twig.extension.intl'
