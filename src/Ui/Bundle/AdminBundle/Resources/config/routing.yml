admin_event_fast_checkin_form:
    path: /event/{event}/fastcheckin/create/{email}
    requirements:
        event: \d+
        email: .*
    methods: [GET, POST]
    controller: Proximum\Vimeet\Ui\Bundle\AdminBundle\Controller\Event\FastCheckin\AddFastCheckinAction

admin_event_fast_checkin_action_checkin:
    path: /event/{event}/fastcheckin/user/{user}/checkin
    requirements:
        event: \d+
        user: \d+
    methods: [GET]
    controller: Proximum\Vimeet\Ui\Bundle\AdminBundle\Controller\User\Event\CheckinEventEntranceAction

# Impersonate
admin_impersonate:
    path: /event/{event}/impersonate/{user}
    requirements:
        event: \d+
        user: \d+
    methods: [POST]
    controller: Proximum\Vimeet\Ui\Bundle\AdminBundle\Controller\Impersonate\ImpersonateAction
