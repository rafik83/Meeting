    path: /event/{event}/order/{order}/group/{group}/row/{row}/remove
    requirements:
        order: \d+
        group: '[a-zA-Z0-9\-]+'
        row: '[a-zA-Z0-9\-]+'
    methods: [DELETE]
    defaults: { _controller: AdminBundle:Order:removeRow }
admin_sheet_order_update_row:
    path: /event/{event}/order/{order}/group/{group}/row/{row}/update
    requirements:
        order: \d+
        group: '[a-zA-Z0-9\-]+'
