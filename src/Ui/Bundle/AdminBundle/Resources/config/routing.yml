    defaults: { _controller: AdminBundle:Template:list }
    methods: [GET, POST]
    requirements:
        template: \d+
admin_template_duplicate:
    path: /template/{template}/duplicate
    defaults: { _controller: AdminBundle:Template:duplicate }
    methods: [GET, POST]
    requirements:
