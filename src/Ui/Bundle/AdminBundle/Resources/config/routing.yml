#
# Login/Logout
#

admin_login:
    path:     /login
    methods:  [GET]
    defaults: { _controller: AdminBundle:Security:login }

admin_login_check:
    path:     /login_check
    methods:  [POST]

admin_logout:
    path:     /logout
    methods:  [GET]

#
# Account
#
admin_account:
    path: /account
    methods: [GET]
    defaults: { _controller: AdminBundle:Account:index }

admin_update_password:
    path: /account/password
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Account:updatePassword }

#
# Create Admin/Organizer
#

admin_list_admin:
    path: /admin
    methods: [GET]
    defaults: { _controller: AdminBundle:Admin:list }

admin_create_admin:
    path: /admin/create
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Admin:create }

admin_update_admin:
    path: /admin/update/{admin}
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Admin:update }

#
# Create Operator
#

admin_list_operator:
    path: /operator
    methods: [GET]
    defaults: { _controller: AdminBundle:Operator:list }

admin_create_operator:
    path: /operator/create
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Operator:create }

admin_update_operator:
    path: /operator/update/{operator}
    methods: [GET, POST]
    requirements:
        operator: \d+
    defaults: { _controller: AdminBundle:Operator:update }

#
# Activate Operator account
#

admin_operator_activate_account:
    path: /activate-account/{token}
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:ActivateAccount:password }

#
# Forgot password
#
admin_forgot_password:
    path: /forgot-password
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:ForgottenPassword:forgottenPassword }

admin_create_new_password:
    path: /reset-password/{token}
    methods:  [GET, POST]
    requirements:
        token: \w+
    defaults: { _controller: AdminBundle:ForgottenPassword:createNewPassword }

#
# Event
#

admin_event_list:
    path: /event
    methods: [GET]
    defaults: { _controller: AdminBundle:Event:list }

admin_event_read:
    path: /event/{event}
    requirements:
        event: \d+
    methods: [GET]
    defaults: { _controller: AdminBundle:Event:read }

admin_event_update:
    path: /event/{event}/update
    requirements:
        event: \d+
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Event:update }

#
# Rule
#

admin_rule_list:
    path: /event/{event}/who-see-who
    requirements:
        event: \d+
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Rule:list }

admin_who_see_who_dont_see_what:
    path: /event/{event}/{seerIdentifier}/{seerId}/see/{seeableIdentifier}/{seeableId}/dont-see
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Rule:what }
    requirements:
        event: \d+
        seerIdentifier: category|type
        seerId: \d+
        seeableIdentifier: category|type
        seeableId: \d+

admin_rule_delete:
    path: /event/{event}/who-see-who/{rule}/delete
    methods: [DELETE]
    defaults: { _controller: AdminBundle:Rule:delete }

#
# Type
#

admin_type_list:
    path: /event/{event}/type
    requirements:
        event: \d+
    methods: [GET]
    defaults: { _controller: AdminBundle:Type:list }

admin_type_create:
    path: /event/{event}/type/create
    requirements:
        event: \d+
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Type:create }

admin_type_update:
    path: /event/{event}/type/{type}/update
    requirements:
        event: \d+
        type: \d+
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:Type:update }

admin_type_template_field_list:
    path: /event/{event}/type/{type}/form
    requirements:
        event: \d+
        type: \d+
    methods: [GET]
    defaults: { _controller: AdminBundle:TypeTemplateField:list }

admin_type_template_field_add:
    path: /event/{event}/type/{type}/form/field/add/{libType}/{position}/to/{templateName}/{group}
    requirements:
        event: \d+
        type: \d+
        position: \d+
        templateName: \w+
        group: \w+
        libType: \w+
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:TypeTemplateField:fieldAdd }

admin_type_template_field_update:
    path: /event/{event}/type/{type}/form/field/update/{templateName}/{group}/{row}
    requirements:
        event: \d+
        type: \d+
        templateName: \w+
        group: \w+
        row: \w+
    methods: [GET, POST]
    defaults: { _controller: AdminBundle:TypeTemplateField:fieldUpdate }

admin_type_template_field_position:
    path: /event/{event}/type/{type}/form/field/position/{templateName}/{group}
    requirements:
        event: \d+
        type: \d+
        templateName: \w+
        group: \w+
    methods: [POST]
    defaults: { _controller: AdminBundle:TypeTemplateField:fieldPosition }

