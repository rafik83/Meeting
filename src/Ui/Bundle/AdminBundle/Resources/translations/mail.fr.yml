mail:
    resetPassword:
        subject: '[%event%] Mot de passe oublié'
        body: |
            Bonjour,
            Vous avez fait une demande de réinitialisation de mot de passe.
            Rendez vous sur ce lien pour pouvoir créer un nouveau mot de passe:
        end: |
            Cordialement,
            L'équipe Vimeet
    activateAccount:
        subject: '[%event%] Activer votre compte'
        body: |
            Bonjour,
            Vous avez été invité en tant que participant pour l'événement %event%
            Pour y accéder, cliquer sur le lien suivant et entrer un mot de passe pour activer votre compte:
        end: |
            Cordialement,
            L'équipe Vimeet
    changeMailOld:
        subject: Demande de changement d'email
        body: |
            Vous venez d'effectuer une demande de changement d'email pour l'email %email%
            Consultez la boite email de cette nouvelle adresse pour valider le changement
            Si vous n'avez pas demandé ce changement, veuillez contacter un administrateur
        end: |
            Cordialement,
            L'équipe Vimeet
    changeMailNew:
        subject: Validation de votre nouvel email
        body: |
            Vous venez d'effectuer une demande de changement d'email,
            Veuillez cliquer sur le lien ci dessous pour valider ce changement
        end: |
            Cordialement,
            L'équipe Vimeet

