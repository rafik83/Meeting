services:
    Proximum\Vimeet\Application\ThirdParty\Openl10n\PullHandler:
        arguments:
            - '%openl10n_config_file%'
            - '@adapter.mailer_adapter'
            - '%mailer_sender%'
        tags:
            - { name: tactician.handler, typehints: true }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Openl10n\PushCommand:
        arguments:
            - '%openl10n_config_file%'
        tags:
            - { name: console.command }
