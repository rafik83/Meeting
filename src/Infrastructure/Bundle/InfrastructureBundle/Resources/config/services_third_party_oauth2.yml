services:
    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\Google\GoogleAuthenticator:
        arguments:
            - '@knpu.oauth2.registry'
            - '@Proximum\Vimeet\Domain\Event\EventByHostResolver'
            - '@Proximum\Vimeet\Application\ThirdParty\Oauth2\GetOrCreateUserHandler'
            - '@session.flash_bag'
            - '@adapter.router'

    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\LinkedIn\LinkedInAuthenticator:
        arguments:
            - '@knpu.oauth2.registry'
            - '@Proximum\Vimeet\Domain\Event\EventByHostResolver'
            - '@Proximum\Vimeet\Application\ThirdParty\Oauth2\GetOrCreateUserHandler'
            - '@session.flash_bag'
            - '@adapter.router'

    Proximum\Vimeet\Application\ThirdParty\Oauth2\GetOrCreateUserHandler:
        arguments:
            - '@Proximum\Vimeet\Application\Command\Participant\ConvertToParticipantHandler'
            - '@template.template_data_factory'
            - '@Proximum\Vimeet\Infrastructure\Adapter\SessionAdapter'
            - '@sheet.sheet_guesser'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.type_repository'
