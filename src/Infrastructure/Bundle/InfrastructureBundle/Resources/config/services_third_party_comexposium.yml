services:
    #
    # Command
    #
    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumWebserviceCallCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumPrepareImportSheetsCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\PrepareImportSheetsHandler'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumGetRegistrationCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
        tags:
            - { name: console.command }

    #
    # Handler
    #
    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\PrepareImportSheetsHandler:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.event.extra_parameter_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\Comexposium\ComexposiumJobQueue'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice:
        arguments:
            $username: '%comexposium_username%'
            $password: '%comexposium_password%'

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\Comexposium\ComexposiumJobQueue:
        arguments:
            - '@doctrine.orm.entity_manager'
