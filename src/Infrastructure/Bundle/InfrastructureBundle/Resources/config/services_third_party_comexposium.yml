services:
    #
    # Command
    #
    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumWebserviceCallCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumPrepareImportSheetsCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\PrepareImportSheetsHandler'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumGetRegistrationsCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ImportSheetsHandler'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\Comexposium\Webservice\ComexposiumExportSpotCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.admin_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\ExportHandler'
        tags:
            - { name: console.command }

    #
    # Handler
    #
    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\PrepareImportSheetsHandler:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.event.extra_parameter_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\Comexposium\ComexposiumJobQueue'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\RemoveAlreadyImportedReferences'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ImportSheetsHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
            - '@repository.event.extra_parameter_repository'
            - '@vimeet_infrastructure.repository.type_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Converter\RawRegistrationToRegistrationViewConverter'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ConvertRegistrationViewToSheet'
            - '@template.template_data_factory'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\RemoveAlreadyImportedReferences'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\PrepareNomenclatureHandler'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ConvertRegistrationViewToSheet:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\SheetAndParticipantTemplateDataHandler'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@vimeet_infrastructure.repository.participant_repository'
            - '@repository.sheet.extra_data_repository'
            - '@repository.user.event.extra_data_repository'
            - '@vimeet_infrastructure.repository.user_event_repository'
            - '@account.synchronizer'
            - '@event_dispatcher'
            - '@Proximum\Vimeet\Domain\Participant\ParticipantOfSheetWithPackageParticipantAndPlanningDisabled'
            - '@datetime'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\SheetAndParticipantTemplateDataHandler: ~

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\RemoveAlreadyImportedReferences:
        arguments:
            - '@repository.sheet.extra_data_repository'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice:
        arguments:
            $username: '%comexposium_username%'
            $password: '%comexposium_password%'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\PrepareNomenclatureHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Converter\RawNomenclatureToNomenclatureViewConverter'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\GetKnownRegistrationsHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\ComexposiumWebservice'
            - '@repository.sheet.extra_data_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\GetEventReferenceHandler'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\GetEventReferenceHandler:
        arguments:
            - '@repository.event.extra_parameter_repository'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Query\HasEventReferenceQueryHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\GetEventReferenceHandler'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Query\HasEventReferenceQuery }

    #
    # Converter
    #
    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Converter\RawRegistrationToRegistrationViewConverter: ~

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Converter\RawNomenclatureToNomenclatureViewConverter: ~

    #
    # JobQueue
    #
    # Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\Comexposium\ComexposiumJobQueue:
    #     arguments:
    #         - '@doctrine.orm.entity_manager'

    #
    # SSO
    #
    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\TokenChecker:
        arguments:
            - '@adapter.http_adapter'
            - '%comexposium_check_user_token_endpoint%'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\LoginHandler:
        arguments:
            - '@adapter.http_adapter'
            - '%comexposium_login_endpoint%'
            - '%comexposium_sso_username%'
            - '%comexposium_sso_password%'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\UserInformationGetter:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\LoginHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\RawUserDataToUserInformationViewConverter'
            - '@adapter.http_adapter'
            - '@repository.event.extra_parameter_repository'
            - '@Proximum\Vimeet\Infrastructure\Repository\Event\ExtraDataRepository'
            - '@Proximum\Vimeet\Application\Command\Event\ExtraData\AddOrUpdateHandler'
            - '%comexposium_get_user_endpoint%'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\RawUserDataToUserInformationViewConverter: ~

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\LocaleConverter: ~

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\EmailToUserConverter:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\UserInformationGetter'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@repository.user.event.extra_data_repository'
            - '@vimeet_infrastructure.repository.user_event_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSORegistrationTypeResolver'
            - '@datetime'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSOCheckerHandler:
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\TokenChecker'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\EmailToUserConverter'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSORegistrationTypeResolver'
            - '@vimeet_infrastructure.repository.type_repository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSOChecker }

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSOComexposiumViewQueryHandler:
        arguments:
            - '@repository.event.extra_parameter_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\LocaleConverter'
            - '%comexposium_sso_loader_lib_endpoint%'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSOComexposiumViewQuery }

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSORedirectionAfterLoginResolver:
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSORegistrationTypeResolver'
            - '@adapter.router'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSORegistrationTypeResolver:
        arguments:
            - '@repository.event.extra_parameter_repository'
            - '@vimeet_infrastructure.repository.type_repository'


    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Command\User\CreateHandler:
        arguments:
            - '@adapter.http_adapter'
            - '@repository.event.extra_parameter_repository'
            - '%comexposium_create_user_endpoint%'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Converter\LocaleConverter'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Command\Participant\OnParticipantAddedHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Command\User\CreateHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Command\Participant\NotifyParticipantAddedHandler'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Command\Participant\OnParticipantAdded }

    Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Command\Participant\NotifyParticipantAddedHandler:
        arguments:
            - '@adapter.mailer_adapter'
            - '@query.mail.participant_mail_view_query_handler'
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Service\EventSender'

    #
    # Guard
    #
    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\Comexposium\SSOAuthenticator:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSOCheckerHandler'
            - '@Proximum\Vimeet\Domain\Event\EventByHostResolver'
            - '@repository.event.extra_parameter_repository'
            - '@session.flash_bag'
            - '@adapter.router'
            - '@Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\Comexposium\SSOAuthenticationSuccessHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\SSO\Application\Query\SSORedirectionAfterLoginResolver'
            - '@Proximum\Vimeet\Application\Command\Sheet\LastLogin\UpdateLastLoginHandler'

    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\Comexposium\SSOAuthenticationSuccessHandler:
        arguments:
            - '@security.http_utils'

    #
    # Get Spots
    #
    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\ExportHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\GetKnownRegistrationsHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\PrepareSpotsContentHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\CreateFileHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\NotifyHandler'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\ScheduleExportHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\Comexposium\ComexposiumJobQueue'
            - '@Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Handler\GetEventReferenceHandler'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\PrepareSpotsContentHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\SerializerAdapter'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\CreateFileHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Adapter\LocalFileStorageAdapter'
            - '@repository.file_repository'
            - '%infrastructure.export_spot_path%'
            - '@datetime'

    Proximum\Vimeet\Application\ThirdParty\Comexposium\Webservice\Spot\NotifyHandler:
        arguments:
            - '@adapter.mailer_adapter'
            - '%mailer_sender%'
