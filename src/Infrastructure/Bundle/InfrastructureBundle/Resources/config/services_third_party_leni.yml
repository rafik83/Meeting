services:
    command.third_party.leni.prepare_leni_api_handler:
        class: Proximum\Vimeet\Application\ThirdParty\LENI\Command\PrepareLeniApiCallHandler
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.event.extra_parameter_repository'
            - '@repository.user.event.extra_data_repository'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@planning.formatter.participant_planning_formatter'
            - '@query.api.leni.leni_user_view_query_handler'
            - '@adapter.serializer_adapter'
            - '@adapter.leni_api_call_job_queue'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\ThirdParty\LENI\PrepareLeniApiCall }

    command.third_party.leni.leni_api_call_handler:
        class: Proximum\Vimeet\Application\ThirdParty\LENI\Command\LeniApiCallHandler
        arguments:
            - '@adapter.http_adapter'
            - '@repository.event.extra_parameter_repository'
            - '@repository.user.event.extra_data_repository'

    adapter.leni_api_call_job_queue:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\LENI\LeniApiCallJobQueue
        arguments:
            - '@doctrine.orm.entity_manager'

    command.api.prepare_leni_api_call_command:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\LENI\PrepareLeniApiCallCommand
        arguments:
            - '@command.third_party.leni.prepare_leni_api_handler'
        tags:
            - { name: console.command }

    command.api.leni_api_call_command:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\LENI\LeniApiCallCommand
        arguments:
            - '@command.third_party.leni.leni_api_call_handler'
            - '@repository.user.event.extra_data_repository'
        tags:
            - { name: console.command }

    serializer.normalizer.api.leni.leni_user_view_normalizer:
        class: Proximum\Vimeet\Application\ThirdParty\LENI\Normalizer\LeniUserViewNormalizer
        tags:
            - { name: serializer.normalizer }
