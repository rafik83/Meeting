services:
    #
    # Handler
    #
    Proximum\Vimeet\Application\ThirdParty\LENI\Save\Command\PrepareLeniApiCallHandler:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.event.extra_parameter_repository'
            - '@repository.user.event.extra_data_repository'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@planning.formatter.participant_planning_formatter'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Save\Query\LeniUserViewQueryHandler'
            - '@adapter.serializer_adapter'
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\LENI\Save\LeniApiCallJobQueue'
            - '@datetime'

    Proximum\Vimeet\Application\ThirdParty\LENI\Save\Command\LeniApiCallHandler:
        arguments:
            - '@repository.user.event.extra_data_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Common\Api\LeniApiCaller'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Common\UserExtraData\UserExtraDataFingerprintManager'
            - '@datetime'

    Proximum\Vimeet\Application\ThirdParty\LENI\Get\Command\LeniApiCallHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Common\Api\LeniApiCaller'
            - '@vimeet_infrastructure.repository.event_repository'
            - '@vimeet_infrastructure.repository.type_repository'
            - '@repository.user.event.extra_data_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Common\EventExtraParameter\MappingGetter'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\RawDataToParticipantConverter'

    #
    # Converter
    #
    Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\TypeConverter: ~

    Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\DataConverter:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\MainDataConverter'

    Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\MainDataConverter: ~

    Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\RawDataToParticipantConverter:
        arguments:
            - '@Proximum\Vimeet\Application\Command\Participant\ConvertToParticipantHandler'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\TypeConverter'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Get\Converter\DataConverter'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Common\TemplateData\ParticipationTypeTemplateDataGetter'
            - '@repository.user.event.extra_data_repository'
            - '@datetime'

    #
    # Job
    #
    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\ThirdParty\LENI\Save\LeniApiCallJobQueue:
        arguments:
            - '@doctrine.orm.entity_manager'

    #
    # Command
    #
    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\LENI\Save\PrepareLeniApiCallCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Save\Command\PrepareLeniApiCallHandler'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\LENI\Save\LeniApiCallCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Save\Command\LeniApiCallHandler'
            - '@repository.user.event.extra_data_repository'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\LENI\Get\LeniApiCallCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Get\Command\LeniApiCallHandler'
        tags:
            - { name: console.command }

    #
    # Normalizer
    #
    Proximum\Vimeet\Application\ThirdParty\LENI\Save\Normalizer\LeniUserViewNormalizer:
        tags:
            - { name: serializer.normalizer }

    #
    # Common services
    #
    Proximum\Vimeet\Application\ThirdParty\LENI\Common\Api\LeniApiCaller:
        arguments:
            - '@adapter.http_adapter'
            - '@repository.event.extra_parameter_repository'

    Proximum\Vimeet\Application\ThirdParty\LENI\Common\UserExtraData\UserExtraDataFingerprintManager:
        arguments:
            - '@repository.user.event.extra_data_repository'
            - '@datetime'

    Proximum\Vimeet\Application\ThirdParty\LENI\Common\EventExtraParameter\MappingGetter:
        arguments:
            - '@repository.event.extra_parameter_repository'

    Proximum\Vimeet\Application\ThirdParty\LENI\Common\TemplateData\ParticipationTypeTemplateDataGetter:
        arguments:
            - '@template.template_data_factory'

    #
    # Queries
    #
    Proximum\Vimeet\Application\ThirdParty\LENI\Save\Query\PrepareLeaderDataHandler:
        arguments:
            - '@repository.user.event.extra_data_repository'

    Proximum\Vimeet\Application\ThirdParty\LENI\Save\Query\LeniUserViewQueryHandler:
        arguments:
            - '@components.user.user_info_guesser'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
            - '@planning.formatter.participant_planning_formatter'
            - '@domain.service.sheets_group.type_name_resolver'
            - '@domain.service.category.category_name_resolver'
            - '@domain.service.sheets_group.group_name_resolver'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@order.balance'
            - '@Proximum\Vimeet\Application\ThirdParty\LENI\Save\Query\PrepareLeaderDataHandler'
