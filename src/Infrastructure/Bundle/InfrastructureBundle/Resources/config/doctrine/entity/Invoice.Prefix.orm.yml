Proximum\Vimeet\Domain\Model\Invoice\Prefix:
    type:  entity
    table: invoice_prefix
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        prefix:
            type: string
            nullable: true
    oneToMany:
        events:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            mappedBy: invoicePrefix
            cascade: ["all"]
            orphanRemoval: true
