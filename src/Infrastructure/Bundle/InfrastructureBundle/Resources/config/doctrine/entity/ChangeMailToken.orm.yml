Proximum\Vimeet\Domain\Model\ChangeMailToken:
    type:  entity
    table: change_mail_token
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        token:
            type: string
            unique: true
        mail:
            type: string
        expireDate:
            type: datetime
    oneToOne:
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                onDelete: CASCADE
