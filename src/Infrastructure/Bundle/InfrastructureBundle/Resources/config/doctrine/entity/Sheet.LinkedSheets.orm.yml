Proximum\Vimeet\Domain\Model\Sheet\LinkedSheets:
    type: entity
    table: linked_sheets
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        createdAt:
            type: datetime
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                nullable: false
                onDelete: CASCADE
    oneToMany:
        sheets:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            mappedBy: linkedSheets
