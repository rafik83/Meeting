Proximum\Vimeet\Domain\Model\Event\CustomLink:
    type:  entity
    table: custom_link
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        iconName:
            type: string
        iconColor:
            type: string
        labelColor:
            type: string
        buttonColor:
            type: string
        priority:
            type: integer
    oneToOne:
        staticFormulation:
            targetEntity: Proximum\Vimeet\Domain\Model\StaticFormulation
            inversedBy: translations
            joinColumn:
                onDelete: CASCADE
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
    oneToMany:
        localizedUrls:
            targetEntity: Proximum\Vimeet\Domain\Model\Event\LocalizedCustomLinkUrl
            mappedBy: customLink
            indexBy: locale
            cascade: ["persist", "remove"]
