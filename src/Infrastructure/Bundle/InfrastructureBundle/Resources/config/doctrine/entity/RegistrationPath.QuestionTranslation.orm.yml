Proximum\Vimeet\Domain\Model\RegistrationPath\QuestionTranslation:
    type:  entity
    table: registration_path_question_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        locale:
            type: string
        title:
            type: text
    manyToOne:
        question:
            targetEntity: Proximum\Vimeet\Domain\Model\RegistrationPath\Question
            inversedBy: translations
            joinColumn:
                onDelete: CASCADE
