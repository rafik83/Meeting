Proximum\Vimeet\Domain\Model\Participant:
    type:  entity
    table: participant
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        data:
            type: json_array
        active:
            type: boolean
    manyToOne:
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            inversedBy: participants
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
        order:
            targetEntity: Proximum\Vimeet\Domain\Model\Order
