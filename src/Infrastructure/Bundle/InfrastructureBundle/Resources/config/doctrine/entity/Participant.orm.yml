Proximum\Vimeet\Domain\Model\Participant:
    type:  entity
    table: participant
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        data:
            type: json_array
        active:
            type: boolean
        registrationStep:
            type: integer
            nullable: true
        registrationComplete:
            type: boolean
    manyToOne:
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            inversedBy: participants
            joinColumn:
                onDelete: CASCADE
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                onDelete: CASCADE
        order:
            targetEntity: Proximum\Vimeet\Domain\Model\Order
            joinColumn:
                onDelete: SET NULL
    oneToMany:
        happeningParticipations:
            targetEntity: Proximum\Vimeet\Domain\Model\HappeningParticipation
            mappedBy: participant
