Proximum\Vimeet\Domain\Model\PackageOptionRank:
    type:  entity
    table: package_option
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        rank:
            type: integer
    manyToOne:
        group:
            targetEntity: Proximum\Vimeet\Domain\Model\PackageGroup
            inversedBy: optionRanks
            joinColumn:
                onDelete: CASCADE
        option:
            targetEntity: Proximum\Vimeet\Domain\Model\Product
            joinColumn:
                onDelete: CASCADE
