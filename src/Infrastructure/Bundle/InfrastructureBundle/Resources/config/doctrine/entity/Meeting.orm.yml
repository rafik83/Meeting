Proximum\Vimeet\Domain\Model\Meeting:
    type: entity
    table: meeting
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        state:
            type: string
        createdAt:
            type: datetime
        blockedSpot:
            type: boolean
            options:
                default: false
        blockedSlot:
            type: boolean
            options:
                default: false
    oneToOne:
        request:
            targetEntity: Proximum\Vimeet\Domain\Model\Meeting\Request
            inversedBy: meeting
            joinColumn:
                nullable: false
                onDelete: CASCADE
    manyToOne:
        slot:
            targetEntity: Proximum\Vimeet\Domain\Model\MeetingSlot
            joinColumn:
                onDelete: CASCADE
        fromSheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            joinColumn:
                onDelete: CASCADE
        toSheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            joinColumn:
                onDelete: CASCADE
        spot:
            targetEntity: Proximum\Vimeet\Domain\Model\Spot
            joinColumn:
                onDelete: CASCADE
    manyToMany:
        fromParticipants:
            targetEntity: Proximum\Vimeet\Domain\Model\Participant
            joinTable:
                name: meeting_from_participants
        toParticipants:
            targetEntity: Proximum\Vimeet\Domain\Model\Participant
            joinTable:
                name: meeting_to_participants
