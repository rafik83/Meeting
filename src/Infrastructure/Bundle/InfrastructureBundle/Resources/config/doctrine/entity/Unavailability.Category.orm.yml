Proximum\Vimeet\Domain\Model\Unavailability\Category:
    type:  entity
    table: unavailability_category
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        picto:
            type: string
        title:
            type: string
        leftColor:
            type: string
        rightColor:
            type: string
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
