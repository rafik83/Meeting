Proximum\Vimeet\Domain\Model\Event\Content:
    type:  entity
    table: content
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        type:
            type: string
    oneToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
    oneToMany:
        translations:
            targetEntity: Proximum\Vimeet\Domain\Model\Event\ContentTranslation
            mappedBy: content
            indexBy: locale
            cascade: ["all"]
            orphanRemoval: true
