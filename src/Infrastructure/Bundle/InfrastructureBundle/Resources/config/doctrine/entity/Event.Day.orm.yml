Proximum\Vimeet\Domain\Model\Event\Day:
    type:  entity
    table: event_day
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        startTime:
            type: datetime
        endTime:
            type: datetime
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            inversedBy: days
            joinColumn:
                onDelete: CASCADE
