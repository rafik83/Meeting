Proximum\Vimeet\Domain\Model\User:
    type:  entity
    table: user
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        email:
            type: string
            unique: true
        password:
            type: string
        salt:
            type: string
        locale:
            type: string
        welcomed:
            type: boolean
            options:
                default: false
        failedAuthentication:
            type: integer
            options:
                default: 0
        lastFailedAuthentication:
            type: datetime
            nullable: true
            options:
                default: null
    embedded:
        account:
            class: Proximum\Vimeet\Domain\Model\User\Account
