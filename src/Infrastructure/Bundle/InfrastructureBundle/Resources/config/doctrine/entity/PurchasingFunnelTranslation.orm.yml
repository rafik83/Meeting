Proximum\Vimeet\Domain\Model\PurchasingFunnelTranslation:
    type:  entity
    table: purchasing_funnel_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        locale:
            type: string
        packagesLabel:
            type: string
        participantAndPlanningLabel:
            type: string
        optionsLabel:
            type: string
    manyToOne:
        purchasingFunnel:
            targetEntity: Proximum\Vimeet\Domain\Model\PurchasingFunnel
            inversedBy: translations
