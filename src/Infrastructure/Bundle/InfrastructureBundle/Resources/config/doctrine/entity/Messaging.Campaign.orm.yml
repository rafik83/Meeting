Proximum\Vimeet\Domain\Model\Messaging\Campaign:
    type:  entity
    table: messaging_campaign
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
            nullable: false
        filters:
            type: json_array
            nullable: true
        createdAt:
            type: datetime
            nullable: false
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
                nullable: false
    manyToMany:
        sheets:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            indexBy: id
            joinTable:
                name: messaging_campaign_sheet
                joinColumns:
                    campaign_id:
                        referencedColumnName: id
                        onDelete: CASCADE
                inverseJoinColumns:
                    sheet_id:
                        referencedColumnName: id
                        onDelete: CASCADE
