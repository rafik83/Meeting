Proximum\Vimeet\Domain\Model\Messaging\Campaign:
    type:  entity
    table: messaging_campaign
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
            nullable: false
        createdAt:
            type: datetime
            nullable: false
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
                nullable: false
