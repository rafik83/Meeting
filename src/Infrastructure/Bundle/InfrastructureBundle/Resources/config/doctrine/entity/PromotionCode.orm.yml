Proximum\Vimeet\Domain\Model\PromotionCode:
    type:  entity
    table: promotion_code
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        code:
            type: string
        validUntil:
            type: datetime
        stock:
            type: integer
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
    oneToMany:
        translations:
            targetEntity: Proximum\Vimeet\Domain\Model\PromotionCodeTranslation
            mappedBy: promotionCode
            indexBy: locale
            cascade: ["all"]
            orphanRemoval: true
        promotions:
            targetEntity: Proximum\Vimeet\Domain\Model\Promotion
            mappedBy: promotionCode
            cascade: ["all"]
            orphanRemoval: true
