Proximum\Vimeet\Domain\Model\Filter\FilledTemplateFilter:
    type:  entity
    table: filled_template_filter
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        templateKey:
            type: string
        label:
            type: string
        informationType:
            type: string
            nullable: true
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
                nullable: false
