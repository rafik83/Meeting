Proximum\Vimeet\Domain\Model\Happening:
    type:  entity
    table: happening
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        begin:
            type: datetime
        end:
            type: datetime
    oneToMany:
        translations:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\HappeningTranslation
            mappedBy: happening
            indexBy: locale
            cascade: ['persist']
        talkings:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\Talking
            mappedBy: happening
            cascade: ['persist', 'remove']
            orphanRemoval: true
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
        category:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening\Category
            joinColumn:
                onDelete: CASCADE
