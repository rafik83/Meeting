Proximum\Vimeet\Domain\Model\UserEvent:
    type:  entity
    table: user_event
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    manyToOne:
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                onDelete: CASCADE
            cascade: ["persist"]
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
        type:
            targetEntity: Proximum\Vimeet\Domain\Model\Type
            joinColumn:
                onDelete: CASCADE
