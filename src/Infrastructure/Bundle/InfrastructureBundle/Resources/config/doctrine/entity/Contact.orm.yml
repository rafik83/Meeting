Proximum\Vimeet\Domain\Model\Contact:
    type:  entity
    table: contact
    id:
        event:
            associationKey: true
        user:
            associationKey: true
        contact:
            associationKey: true
    fields:
        createdAt:
            type: datetime
            nullable: false
        evaluation:
            type: smallint
            nullable: true
        comment:
            type: text
            nullable: true
        origin:
            type: string
            length: 20
            nullable: false
        scanned:
            type: boolean
            nullable: false
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                nullable: false
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                nullable: false
        contact:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                nullable: false
