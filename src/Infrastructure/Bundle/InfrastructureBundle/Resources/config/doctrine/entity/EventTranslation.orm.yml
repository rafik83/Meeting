Proximum\Vimeet\Domain\Model\EventTranslation:
    type:  entity
    table: event_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        description:
            type: text
        locale:
            type: string
        bankInfo:
            type: string
            nullable: true
        billingAddress:
            type: string
            nullable: true
        paymentCondition:
            type: string
            nullable: true
        paymentFooter:
            type: string
            nullable: true
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            inversedBy: translations
