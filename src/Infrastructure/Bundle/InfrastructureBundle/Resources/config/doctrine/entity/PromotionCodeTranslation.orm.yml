Proximum\Vimeet\Domain\Model\PromotionCodeTranslation:
    type:  entity
    table: promotion_code_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        description:
            type: string
    manyToOne:
        promotionCode:
            targetEntity: Proximum\Vimeet\Domain\Model\PromotionCode
            inversedBy: translations
            joinColumn:
                onDelete: CASCADE
