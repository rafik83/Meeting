Proximum\Vimeet\Domain\Model\CartRow:
    type:  entity
    table: cart_row
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        quantity:
            type: integer
        serializedProduct:
            type: json_array
    manyToOne:
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            joinColumn:
                onDelete: CASCADE
        product:
            targetEntity: Proximum\Vimeet\Domain\Model\Product
            joinColumn:
                onDelete: CASCADE
    oneToMany:
        cartRowParticipants:
            targetEntity: Proximum\Vimeet\Domain\Model\CartRowParticipant
            cascade: ['persist', 'remove']
            mappedBy: cartRow
            orphanRemoval: true
