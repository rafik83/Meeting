Proximum\Vimeet\Domain\Model\Template\RegistrationTemplate:
    type:  entity
    table: template_registration
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        locales:
            type: json_array
        fallback:
            type: string
            length: 5
        value:
            type: json_array
        createdAt:
            type: datetime
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
    oneToMany:
        types:
            targetEntity: Proximum\Vimeet\Domain\Model\Type
            mappedBy: registrationTemplate
