Proximum\Vimeet\Domain\Model\TypeTranslation:
    type:  entity
    table: type_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        description:
            type: text
            nullable: true
        locale:
            type: string
    manyToOne:
        type:
            targetEntity: Proximum\Vimeet\Domain\Model\Type
            inversedBy: translations
            joinColumn:
                onDelete: CASCADE
