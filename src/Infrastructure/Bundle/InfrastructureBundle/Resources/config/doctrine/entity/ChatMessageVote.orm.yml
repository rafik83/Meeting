Proximum\Vimeet\Domain\Model\ChatMessageVote:
    type:  entity
    table: chat_message_vote
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        type:
            type: string
    manyToOne:
        chatMessage:
            targetEntity: Proximum\Vimeet\Domain\Model\ChatMessage
            joinColumn:
                onDelete: CASCADE
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                onDelete: CASCADE
