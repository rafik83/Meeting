Proximum\Vimeet\Domain\Model\HappeningParticipation:
    type:  entity
    table: happening_participation
    uniqueConstraints:
        unique_happening_user:
            columns:
                - happening_id
                - user_id
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        disabled:
            type: boolean
            options:
                default: false
        visible:
            type: boolean
            options:
                default: true
    manyToOne:
        happening:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening
            inversedBy: participations
            joinColumn:
                onDelete: CASCADE
        user:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                onDelete: CASCADE
