Proximum\Vimeet\Domain\Model\HappeningParticipation:
    type:  entity
    table: happening_participation
    uniqueConstraints:
        unique_idx_1:
            columns:
                - happening_id
                - participant_id
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    manyToOne:
        happening:
            targetEntity: Proximum\Vimeet\Domain\Model\Happening
        participant:
            targetEntity: Proximum\Vimeet\Domain\Model\Participant
