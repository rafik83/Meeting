Proximum\Vimeet\Domain\Model\Meeting\Request:
    type: entity
    table: meeting_request
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        state:
            type: string
        createdAt:
            type: datetime
        stateUpdatedAt:
            type: datetime
    manyToOne:
        meeting:
            targetEntity: Proximum\Vimeet\Domain\Model\Meeting
            joinColumn:
                onDelete: SET NULL
        from:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            joinColumn:
                onDelete: CASCADE
        to:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            joinColumn:
                onDelete: CASCADE
        creator:
            targetEntity: Proximum\Vimeet\Domain\Model\User
            joinColumn:
                onDelete: CASCADE
    manyToMany:
        fromParticipants:
            targetEntity: Proximum\Vimeet\Domain\Model\Participant
            joinTable:
                name: meeting_request_from_participants
            joinColumn:
                onDelete: CASCADE
        toParticipants:
            targetEntity: Proximum\Vimeet\Domain\Model\Participant
            joinTable:
                name: meeting_request_to_participants
            joinColumn:
                onDelete: CASCADE
