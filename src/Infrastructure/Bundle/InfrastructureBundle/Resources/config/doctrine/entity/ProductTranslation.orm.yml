Proximum\Vimeet\Domain\Model\ProductTranslation:
    type:  entity
    table: product_translation
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        title:
            type: string
        heading:
            type: string
            nullable: true
        description:
            type: text
            nullable: true
        addon:
            type: text
            nullable: true
        locale:
            type: string
        subjectedToValidationHelp:
            type: string
            nullable: true
    manyToOne:
        product:
            targetEntity: Proximum\Vimeet\Domain\Model\Product
            inversedBy: translations
            joinColumn:
                onDelete: CASCADE
