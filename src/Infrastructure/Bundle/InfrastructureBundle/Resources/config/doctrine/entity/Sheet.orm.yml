Proximum\Vimeet\Domain\Model\Sheet:
    type:  entity
    table: sheet
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        data:
            type: json_array
            nullable: true
        registrationData:
            type: json_array
            nullable: true
        createdAt:
            type: datetime
        lastLoginAt:
            type: datetime
            nullable: true
        state:
            type: string
        completeness:
            type: integer
        enable:
            type: boolean
        inCatalog:
            type: boolean
        inCatalogAt:
            type: datetime
            nullable: true
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
        owner:
            targetEntity: Proximum\Vimeet\Domain\Model\User
        type:
            targetEntity: Proximum\Vimeet\Domain\Model\Type
        follower:
            targetEntity: Proximum\Vimeet\Domain\Model\Admin
        spot:
            targetEntity: Proximum\Vimeet\Domain\Model\Spot
            inversedBy: sheets
            joinColumn:
                onDelete: SET NULL
    oneToMany:
        participants:
            targetEntity: Proximum\Vimeet\Domain\Model\Participant
            mappedBy: sheet
        orders:
            targetEntity: Proximum\Vimeet\Domain\Model\Order
            mappedBy: sheet
