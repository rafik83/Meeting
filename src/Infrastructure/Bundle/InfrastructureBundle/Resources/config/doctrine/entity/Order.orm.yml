Proximum\Vimeet\Domain\Model\Order:
    type: entity
    table: _order
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        createdAt:
            type: datetime
        vatMode:
            type: string
        vatRate:
            type: float
    manyToOne:
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            inversedBy: orders
    oneToMany:
        rows:
            targetEntity: Proximum\Vimeet\Domain\Model\Order\Row
            mappedBy: order
    embedded:
        billingInfo:
            class: Proximum\Vimeet\Domain\Model\Order\BillingInfo
