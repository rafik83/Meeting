Proximum\Vimeet\Domain\Model\Invoice\Invoice:
    type: entity
    table: invoice
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        total:
            type: float
        totalWithVat:
            type: float
        vatAmount:
            type: float
        number:
            type: string
        createdAt:
            type: datetime
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
