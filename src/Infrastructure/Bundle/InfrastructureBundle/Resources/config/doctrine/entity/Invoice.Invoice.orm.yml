Proximum\Vimeet\Domain\Model\Invoice\Invoice:
    type: entity
    table: invoice
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        total:
            type: float
        number:
            type: string
        createdAt:
            type: datetime

    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
            joinColumn:
                onDelete: CASCADE
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
            joinColumn:
                onDelete: CASCADE
