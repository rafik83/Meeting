Proximum\Vimeet\Domain\Model\Invoice\Invoice:
    type: entity
    table: invoice
    id:
        id:
            type: integer
            generator:
                strategy: AUTO
    fields:
        total:
            type: integer
        totalWithVat:
            type: integer
        vatAmount:
            type: integer
        invoicePrefix:
            type: string
            column: invoice_prefix
        invoiceYear:
            type: integer
            column: invoice_year
        invoiceIncrement:
            type: integer
            column: invoice_increment
        createdAt:
            type: datetime
        data:
            type: json_array
    manyToOne:
        event:
            targetEntity: Proximum\Vimeet\Domain\Model\Event
        sheet:
            targetEntity: Proximum\Vimeet\Domain\Model\Sheet
        prefix:
            targetEntity: Proximum\Vimeet\Domain\Model\Invoice\Prefix
    uniqueConstraints:
        invoice_number:
            columns: prefix_id, invoice_prefix, invoice_year, invoice_increment
