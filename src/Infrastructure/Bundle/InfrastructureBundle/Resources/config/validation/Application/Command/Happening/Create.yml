Proximum\Vimeet\Application\Command\Happening\Create:
    properties:
        category:
            - NotNull: ~
        translations:
            - All:
                - Collection:
                    fields:
                        title:
                            - NotBlank: ~
                        description: ~
        begin:
            - NotNull: ~
        end:
            - NotNull: ~
            - Expression:
                expression: "this.begin < this.end"
                message: "validators.happening.startTimeMustBeBeforeEndTime"
        questionAllowed:
            - NotNull: ~
        limitParticipant:
            - Type: int
            - Range:
                min: 0
