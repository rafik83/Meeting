Proximum\Vimeet\Application\Command\Participant\ImportMapping:
    constraints:
        - Expression:
            expression: "this.isEmailInMappings() === true"
            message: "validators.participant_imported.empty_mail_mapping"
        - Expression:
            expression: "this.isOnlyOneEmailMapping() === true"
            message: "validators.participant_imported.duplicate_mail_mapping"
        - Expression:
              expression: "this.isGroupTitleInMappingsForAllowMultiSheet() === true"
              message: "validators.participant_imported.empty_group_title_mapping"
    properties:
        mappings:
            - Valid: ~
