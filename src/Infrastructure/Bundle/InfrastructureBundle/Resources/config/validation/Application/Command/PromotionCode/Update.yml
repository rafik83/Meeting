Proximum\Vimeet\Application\Command\PromotionCode\Update:
    properties:
        title:
            - NotBlank: ~
            - Type: { type: string }
        code:
            - NotBlank: ~
            - Type: { type: string }
        validUntil:
            - Date: ~
        stock:
            - Type: { type: int }
        translations:
            - Count: { min: 1 }
            - All:
                - Collection:
                    label:
                        - NotBlank: ~
                        - Type: { type: string }
                    description:
                        - Type: { type: string }
        promotions:
            - Count: { min: 1 }
            - All:
                - Expression:
                    expression: "value['type'] === 'free' || value['value'] !== null"
                    message: "validators.promotion_code.promotion.value"
                - Collection:
                    product:
                        - NotBlank: ~
                    type:
                        - NotBlank: ~
                        - Type: { type: string }
                    value:
                        - Type: { type: float }
