Proximum\Vimeet\Application\Command\Event\Day\Update:
    properties:
        days:
            - All:
                - Collection:
                    day:
                        - NotNull: ~
                        - Type: { type: datetime }
                    startTime:
                        - NotNull: ~
                        - Type: { type: datetime }
                    endTime:
                        - NotNull: ~
                        - Type: { type: datetime }
                - Expression:
                    expression: "value['startTime'] < value['endTime']"
                    message: "validators.schedule_day.startTimeMustBeBeforeEndTime"
