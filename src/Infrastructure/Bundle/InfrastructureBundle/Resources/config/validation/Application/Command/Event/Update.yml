Proximum\Vimeet\Application\Command\Event\Update:
    properties:
        title:
            - NotBlank: ~
        vat:
            - NotBlank: ~
        logo:
            - Image:
                mimeTypes: ["image/jpeg", "image/pjpeg", "image/png", "image/x-png"]
        textColor:
            - NotBlank: ~
            - Regex:
                pattern: '/^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/'
                message: validators.hexadecimal
        leftColor:
            - NotBlank: ~
            - Regex:
                pattern: '/^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/'
                message: validators.hexadecimal
        rightColor:
            - NotBlank: ~
            - Regex:
                pattern: '/^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/'
                message: validators.hexadecimal
