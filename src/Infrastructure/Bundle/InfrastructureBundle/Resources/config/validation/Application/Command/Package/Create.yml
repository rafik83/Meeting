Proximum\Vimeet\Application\Command\Package\Create:
    properties:
        name:
            - NotBlank: ~
        unitPrice:
            - NotBlank: ~
            - Range:
                min: 0
        file:
            - Image: ~
        availabilityCurrent:
            - Range:
                min: 0
        availabilityMax:
            - Range:
                min: 0
        translations:
            - All:
                - Collection:
                    fields:
                        title:
                            - NotBlank: ~
                        descriptionTitle:
                            - NotBlank: ~
                        descriptionContent: ~
                        optionalPriceText: ~
        features:
            - All:
                - Collection:
                    fields:
                        translations:
                            - All:
                                - Collection:
                                    fields:
                                        title:
                                            - NotBlank: ~
                                        description: ~
        productIncluded:
            - All:
                - Collection:
                    fields:
                        quantity:
                            - NotBlank: ~
                            - Range:
                                min: 0
                        product:
                            - NotBlank: ~
