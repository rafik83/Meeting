services:
    Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Normalizer\ContactNormalizer: ~
    Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Handler\ConvertContactToSheet:
        arguments:
            - '@repository.user.event.extra_data_repository'
            - '@Proximum\Vimeet\Application\Command\Participant\ConvertToParticipantHandler'
            - '@datetime'
            - '@Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Normalizer\ContactNormalizer'
            - '@vimeet_infrastructure.repository.user_repository'
    Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Handler\ImportSheetsHandler:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Client\WSClient'
            - '@vimeet_infrastructure.repository.type_repository'
            - '@template.template_data_factory'
            - '@Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Handler\ConvertContactToSheet'
            - '@monolog.logger'
    Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Handler\PrepareImportSheetsHandler:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.event.extra_parameter_repository'
            - '@Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Handler\ImportSheetsHandler'
    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\ThirdParty\TechEvent\PrepareImportSheetsCommand:
        arguments:
            - '@Proximum\Vimeet\Application\ThirdParty\TechEvent\Webservice\Handler\PrepareImportSheetsHandler'
        tags:
            - { name: console.command }

    #
    # Guard
    #
    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\TechEvent\TechEventAuthenticator:
        arguments:
            - '@Proximum\Vimeet\Domain\Event\EventByHostResolver'
            - '@repository.user.event.extra_data_repository'
            - '@vimeet_infrastructure.repository.user_repository'
            - '@session.flash_bag'
            - '@adapter.router'
            - '@Proximum\Vimeet\Application\Command\Sheet\LastLogin\UpdateLastLoginHandler'
            - '@Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\TechEvent\TechEventAuthenticationSuccessHandler'
            - '@security.csrf.token_manager'

    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\TechEvent\TechEventTokenAuthenticator:
        arguments:
            - '@Proximum\Vimeet\Domain\Event\EventByHostResolver'
            - '@repository.user.event.extra_data_repository'
            - '@session.flash_bag'
            - '@adapter.router'
            - '@Proximum\Vimeet\Application\Command\Sheet\LastLogin\UpdateLastLoginHandler'

    Proximum\Vimeet\Infrastructure\Security\Guard\ThirdParty\TechEvent\TechEventAuthenticationSuccessHandler:
        arguments:
            - '@security.http_utils'
