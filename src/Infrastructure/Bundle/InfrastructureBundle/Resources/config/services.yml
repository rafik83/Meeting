    #
    promotion.faker_code_generator:
        class: Proximum\Vimeet\Domain\Promotion\Generator\FakerCodeGenerator
    promotion.unique_code_checker:
        class: Proximum\Vimeet\Domain\Promotion\Checker\UniqueCodeChecker
        arguments:
            - '@repository.promotion_code_repository'
