        class: Proximum\Vimeet\Domain\Package\Product\QuantityMinGuesser
        arguments:
            - '@order.merger'
    package.product.included_participant_guesser:
        class: Proximum\Vimeet\Domain\Package\Product\IncludedParticipantGuesser
        arguments:
            - '@cart_manager'
            - '@order.merger'
    package.specification.vat_applicable:
        class: Proximum\Vimeet\Domain\Package\Specification\VatApplicable
        arguments:
            - '@repository.billing_info_repository'
            - '%infrastructure.eu_countries%'
