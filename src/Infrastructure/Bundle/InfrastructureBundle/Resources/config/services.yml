    #
    vimeet.payum.paypal.prepare_payment:
        class: Proximum\Vimeet\Infrastructure\Payum\Paypal\PreparePayment
        arguments:
            - '@payum'
            - '@repository.billing_info_repository'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
