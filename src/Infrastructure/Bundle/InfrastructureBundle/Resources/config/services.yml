        class: Proximum\Vimeet\Domain\Package\Orders\OrdersChecker
        arguments:
            - '@vimeet_infrastructure.repository.notification_repository'

    #
    # Cart
    #
    cart_manager:
        class: Proximum\Vimeet\Domain\Cart\CartManager
        arguments:
            - '@repository.cart_row_repository'
            - '@repository.cart_step_repository'
            - '@repository.promotion_code_row_repository'
            - '@order.merger'
