    # Sheet
    #
    sheet.completeness_calculator:
        class: Proximum\Vimeet\Domain\Sheet\CompletenessCalculator
        arguments:
            - '@template.template_data_factory'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@repository.sheet.completeness_repository'
            - '@vimeet_infrastructure.adapter.delayed_event_dispatcher'

