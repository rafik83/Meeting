        class: Proximum\Vimeet\Application\Serializer\Normalizer\EventSheetsNormalizer
        parent: 'serializer.abstract_normalizer'
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@template.template_data_factory'
        tags:
            - { name: serializer.normalizer }

    serializer.normalizer.happening_participant:
        class: Proximum\Vimeet\Application\Serializer\Normalizer\HappeningParticipantNormalizer
        parent: 'serializer.abstract_normalizer'
        tags:
            - { name: serializer.normalizer }

