    # SendGrid API
    #
    domain.messaging.sendgrid_api_client.factory:
        class: Proximum\Vimeet\Domain\Messaging\SendGridApiClientFactory
        arguments:
            - '%sendgrid_api_key%'

    domain.messaging.sendgrid_api_client:
        class: Proximum\Vimeet\Domain\Messaging\SendGridApiClient
        factory: ['@domain.messaging.sendgrid_api_client.factory', 'createClient']
