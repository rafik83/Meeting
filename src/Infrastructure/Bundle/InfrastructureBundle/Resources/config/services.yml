        class: Proximum\Vimeet\Infrastructure\Payum\Paypal\CapturePayment
        arguments:
            - '@payum'
            - '@repository.transaction'
            - '@vimeet_infrastructure.adapter.delayed_event_dispatcher'
    vimeet.payum.paypal.action.store_notification:
        class: Proximum\Vimeet\Infrastructure\Payum\Paypal\StoreNotificationAction
        arguments:
            - '@repository.payment.notification_repository'
            - '@repository.payment.payment_repository'
            - '@domain.transaction.transaction_manager'
