        class: Proximum\Vimeet\Domain\Cart\Converter
        arguments:
            - '@vimeet_infrastructure.repository.order_repository'
            - '@repository.cart_row_repository'
            - '@repository.cart_step_repository'
            - '@repository.billing_info_repository'
            - '@repository.promotion_code_row_repository'
            - '@repository.promotion_code_repository'
            - '@package.specification.vat_applicable'
            - '@datetime'

    #
    # Catalog
    #
    catalog.visible_participation_types:
        class: Proximum\Vimeet\Domain\Catalog\VisibleParticipationTypes
        arguments:
            - '@repository.rule_repository'

