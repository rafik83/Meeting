            - '@repository.cart_step_repository'

    #
    # Package
    #
    package.planning.quantity_max_guesser:
        class: Proximum\Vimeet\Domain\Package\Product\QuantityMaxGuesser
        arguments:
            - '@cart_manager'
            - '@order.merger'
    package.product.template_product_guesser:
        class: Proximum\Vimeet\Domain\Package\Product\TemplateProductGuesser
        arguments:
            - '@datetime'
    package.planning.quantity_min_guesser:
        class: Proximum\Vimeet\Domain\Package\Product\QuantityMinGuesser
        arguments:
            - '@order.merger'
    package.specification.vat_applicable:
        class: Proximum\Vimeet\Domain\Package\Specification\VatApplicable
        arguments:
            - '@repository.billing_info_repository'
            - '%infrastructure.eu_countries%'

    #
    # Cart
    #
    cart_manager:
        class: Proximum\Vimeet\Domain\Cart\CartManager
        arguments:
            - '@repository.cart_row_repository'
            - '@repository.cart_step_repository'
            - '@repository.promotion_code_row_repository'
            - '@order.merger'
    buyable_object_resolver:
        class: Proximum\Vimeet\Domain\Cart\BuyableObjectResolver
        arguments:
            - '@cart_manager'
            - '@template.template_data_factory'
            - '@transformer.product.id_to_product_transformer'
    cart.converter:
        class: Proximum\Vimeet\Domain\Cart\Converter
        arguments:
            - '@vimeet_infrastructure.repository.order_repository'
            - '@repository.cart_row_repository'
            - '@repository.cart_step_repository'
            - '@repository.billing_info_repository'
            - '@repository.promotion_code_row_repository'
            - '@repository.promotion_code_repository'
            - '@package.specification.vat_applicable'
            - '@datetime'

    #
    # Promotion
    #
    promotion.faker_code_generator:
        class: Proximum\Vimeet\Domain\Promotion\Generator\FakerCodeGenerator
    promotion.unique_code_checker:
        class: Proximum\Vimeet\Domain\Promotion\Checker\UniqueCodeChecker
        arguments:
            - '@repository.promotion_code_repository'
    promotion.generator.unique_code_generator:
        class: Proximum\Vimeet\Domain\Promotion\Generator\UniqueCodeGenerator
        arguments:
            - '@promotion.faker_code_generator'
            - '@promotion.unique_code_checker'

    #
    # MeetingSlot
    #
    domain.meeting.slot.slot_generator:
        class: Proximum\Vimeet\Domain\Meeting\Slot\SlotGenerator

    #
    # Payment
    #
    payment.total_to_pay:
        class: Proximum\Vimeet\Domain\Payment\TotalToPay
        arguments:
            - '@cart_manager'
            - '@package.specification.vat_applicable'

    #
    # Order
    #
    order.balance:
        class: Proximum\Vimeet\Domain\Order\Balance
        arguments:
            - '@vimeet_infrastructure.repository.order_repository'
            - '@repository.transaction'
    order.merger:
        class: Proximum\Vimeet\Domain\Order\Merger
    order.row.product_included_info_guesser:
        class: Proximum\Vimeet\Domain\Order\Row\ProductIncludedInfoGuesser

    #
    # KeyDates
    #
    domain.key_dates.checker.happenings_access_checker:
        class: Proximum\Vimeet\Domain\KeyDates\Checker\HappeningsAccessChecker
        arguments: ['@datetime']

    domain.key_dates.checker.schedule_access_checker:
        class: Proximum\Vimeet\Domain\KeyDates\Checker\ScheduleAccessChecker
        arguments: ['@datetime']

    domain.key_dates.checker.catalog_access_checker:
        class: Proximum\Vimeet\Domain\KeyDates\Checker\CatalogAccessChecker
        arguments: ['@datetime']

    #
    # Nomenclature
    #
    application.nomenclature.id.uniqu_id_generator:
        class: Proximum\Vimeet\Application\Nomenclature\Id\UniquIdGenerator
    application.nomenclature.import.csv_importer:
        class: Proximum\Vimeet\Application\Nomenclature\Import\CsvImporter
        arguments:
            - '@application.nomenclature.id.uniqu_id_generator'
    application.nomenclature.export.csv_exporter:
        class: Proximum\Vimeet\Application\Nomenclature\Export\CsvExporter
    application.nomenclature.nomenclature_cloner:
        class: Proximum\Vimeet\Application\Nomenclature\NomenclatureCloner
        arguments:
            - '@repository.nomenclature_repository'
    #
    # Event
    #
    domain.event.has_sheet:
        class: Proximum\Vimeet\Domain\Event\HasSheet
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'

    #
    # Payum
    #
    vimeet.payum.paypal.prepare_payment:
        class: Proximum\Vimeet\Infrastructure\Payum\Paypal\PreparePayment
        arguments:
            - '@payum'
            - '@repository.billing_info_repository'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
            - '@vimeet_infrastructure.adapter.translator_adapter'
    vimeet.payum.paypal.capture_payment:
        class: Proximum\Vimeet\Infrastructure\Payum\Paypal\CapturePayment
        arguments:
            - '@payum'
            - '@repository.transaction'
    vimeet.payum.paypal.action.store_notification:
        class: Proximum\Vimeet\Infrastructure\Payum\Paypal\StoreNotificationAction
        arguments:
            - '@repository.payment.notification_repository'
            - '@datetime'
