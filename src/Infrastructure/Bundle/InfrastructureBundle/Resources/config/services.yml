    # Nomenclature
    #
    application.nomenclature.id.uniqu_id_generator:
        class: Proximum\Vimeet\Application\Nomenclature\Id\UniquIdGenerator
    application.nomenclature.import.csv_importer:
        class: Proximum\Vimeet\Application\Nomenclature\Import\CsvImporter
        arguments:
            - '@application.nomenclature.id.uniqu_id_generator'
    application.nomenclature.export.csv_exporter:
        class: Proximum\Vimeet\Application\Nomenclature\Export\CsvExporter
    application.nomenclature.nomenclature_cloner:
        class: Proximum\Vimeet\Application\Nomenclature\NomenclatureCloner
        arguments:
            - '@repository.nomenclature_repository'
