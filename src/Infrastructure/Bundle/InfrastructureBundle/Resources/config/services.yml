        class: Proximum\Vimeet\Domain\KeyDates\Checker\ScheduleAccessChecker
        arguments: ['@datetime']

    domain.key_dates.checker.catalog_access_checker:
        class: Proximum\Vimeet\Domain\KeyDates\Checker\CatalogAccessChecker
        arguments: ['@datetime']

