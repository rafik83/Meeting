services:
    #
    # Event
    #
    vimeet_infrastructure.adapter.delayed_event_dispatcher:
        class: Proximum\Vimeet\Infrastructure\Adapter\DelayedEventDispatcher
        arguments:
            - '@event_dispatcher'
        tags:
            - { name: kernel.event_listener, event: kernel.terminate, method: process }

    #
    # Subscriber
    #
    notification_subscriber:
        abstract:  true
        arguments:
            - '@vimeet_infrastructure.repository.notification_repository'
            - '@vimeet_infrastructure.application.components.sheet.sheet_info_guesser'
            - '@vimeet_infrastructure.adapter.translator_adapter'
            - '@adapter.router'

    vimeet_app.vimeet.application.event.notification_on_meeting_event_subscriber:
        class: Proximum\Vimeet\Application\Event\NotificationOnMeetingEventSubscriber
        parent: notification_subscriber
        tags:
            - { name: 'kernel.event_subscriber' }
    vimeet_app.vimeet.application.event.notification_on_message_event_subscriber:
        class: Proximum\Vimeet\Application\Event\NotificationOnMessageEventSubscriber
        parent: notification_subscriber
        tags:
            - { name: 'kernel.event_subscriber' }
    vimeet_app.vimeet.application.event.notification_on_request_event_subscriber:
        class: Proximum\Vimeet\Application\Event\NotificationOnRequestEventSubscriber
        parent: notification_subscriber
        tags:
            - { name: 'kernel.event_subscriber' }
    vimeet_app.vimeet.application.event.notification_on_sheet_event_subscriber:
        class: Proximum\Vimeet\Application\Event\NotificationOnSheetEventSubscriber
        parent: notification_subscriber
        tags:
            - { name: 'kernel.event_subscriber' }

    #
    # Repositories
    #
    vimeet_infrastructure.repository.event_repository:
        class: Proximum\Vimeet\Infrastructure\Repository\EventRepository
        arguments:
            - '@doctrine.orm.entity_manager'
    vimeet_infrastructure.repository.type_repository:
        class: Proximum\Vimeet\Infrastructure\Repository\TypeRepository
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@vimeet.components.paginator'
    vimeet_infrastructure.repository.category_repository:
