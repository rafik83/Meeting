        __construct: { createOption: ['@event_spanish', 'Option chaise', 0, 9, 20, 10, 0, 0, true, null] }
    product_option_3_spanish_event:
        __construct: { createOption: ['@event_spanish', 'Option A', 0, 9, 20, 10, 0, 0, true, null] }
    product_option_4_spanish_event:
        __construct: { createOption: ['@event_spanish', 'Option B', 0, 9, 20, 10, 0, 0, true, null] }
    product_option_5_spanish_event:
