Proximum\Vimeet\Domain\Model\Invoice\Prefix:
    prefix_spanish:
        __construct:
            - 'Spanish'
            - 'Spa'
            - false

Proximum\Vimeet\Domain\Model\Event:
    event_spanish:
        __construct:
            - "Evento en español"        #title
            -  es                        #fallback
            - [es]                       #locales
            - 'et'                       #mode
            - 20                         #vat
            - 'ES'                       #country
            -  'EUR'                     #currency
            - 'Europe/Paris'             #timeZone
            - spanish-event.<domain()>   #domain
            - "PROXIMUM"                 #organiserName
            - 'team-project@example.net' #emailTeam
            - '@prefix_spanish'
        locales: [es]
        assetPath: ''
        paymentAddress: '@payment_address_event_spanish'
        configuration: '@configuration_event_spanish'
        organiserEmail: accounts@proximumgroup.com


Proximum\Vimeet\Domain\Model\EventTranslation:
    event_spanish_es:
        __construct: false
        description: "Descripción de mi evento en español"
