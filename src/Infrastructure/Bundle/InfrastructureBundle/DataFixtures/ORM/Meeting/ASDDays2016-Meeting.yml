Proximum\Vimeet\Domain\Model\Meeting:
    asddays_meeting_01:
        __construct: false
        slot: '@meeting_slot_day_one_1'
        fromSheet: '@sheet_asddays_1'
        fromParticipants: ['@participant_asddays_1']
        toSheet: '@sheet_asddays_empty'
        toParticipants: ['@participant_asddays_2']
        createdAt: <(new DateTime('2016-10-12 09:00:00'))>
        spot: '@asddays_spot_1'
    asddays_meeting_02:
        __construct: false
        slot: '@meeting_slot_day_one_2'
        fromSheet: '@sheet_asddays_1'
        fromParticipants: ['@participant_asddays_1']
        toSheet: '@sheet_asddays_empty_with_tag'
        toParticipants: ['@participant_asddays_3']
        createdAt: <(new DateTime('2016-10-12 11:00:00'))>
        spot: '@asddays_spot_1'

Proximum\Vimeet\Domain\Model\Meeting\Request:
