        state: 'approved'
        meeting: '@asddays_meeting_01'
    meeting_request_02:
        __construct:
            - '@sheet_asddays_1'
            - ['@participant_asddays_1']
            - '@sheet_asddays_empty_with_tag'
            - ['@participant_asddays_3']
            - <dateTimeBetween('-3 days', 'now')>
            - '@user_test'
        state: 'approved'
        meeting: '@asddays_meeting_02'

Proximum\Vimeet\Domain\Model\Unavailability:
