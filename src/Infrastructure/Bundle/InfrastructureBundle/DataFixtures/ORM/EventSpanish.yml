Proximum\Vimeet\Domain\Model\Event:
    event_spanish:
        title: Evento en español
        domain: spanish-event.<domain()>
        timeZone: 'Europe/Paris'
        locales: [es]
        fallback: es
        assetPath: ''
        organiserName: PROXIMUM
        paymentAddress: '@payment_address_event_spanish'
        configuration: '@configuration_rdv_carnot_2016'
        organiserEmail: accounts@proximumgroup.com
        bankInfo: |+
            HSBC Issy les Moulineaux
            IBAN: FR76 3005 6006 4306 4332 4153 439
            SWIFT (BIC): CCFRFRPP
        legalInformation: |+
            IVA pagado en los recibos
            No hay descuento por pronto pago
        # vat mode :
        # - 'ati' = All Taxes Include : prices include taxes, no additional taxes computed
        # - 'et'  = Exclusive of Taxes : prices don't includes taxes, taxes are computed from prices
        mode: 'et'
        vat: 20
        elementToJoinWithInvoice: |+
            - Número de la factura
            - Nombre del evento
            - Pasivos netos
        billingTemplate:
            5645e4242d3df:
                type: lib_text
                required: true
                label: { es: "Nombre" }
                tags: ["billing_name"]
            5645e47e7e499:
                type: lib_text
                required: false
                label: { es: "teléfono" }
                tags: ["billing_phone"]
            5645e52f445d1:
                type: lib_email
                required: true
                label: { es: "E-mail" }
                tags: ["billing_email"]
            5645e534daa0b:
                type: lib_text
                required: true
                label: { es: "Empresa" }
                tags: ["billing_organization"]
            5645e54061ff2:
                type: lib_text
                required: true
                label: { es: "dirección" }
                tags: ["billing_address"]
            5645e5f35a9e0:
                type: lib_text
                required: true
                label: { es: "Código postal" }
                tags: ["billing_zipcode"]
            5645e6067f46a:
                type: lib_text
                required: true
                label: { es: "Ciudad" }
                tags: ["billing_city"]
            5645e5fd8f6a7:
                type: lib_country
                required: true
                label: { es: "país" }
                placeholder: { es: "--- Seleccionar un país  ---" }
                tags: ["billing_country"]
            5645e610e0e1b:
                type: lib_text
                required: false
                label: { es: "N° IVA" }
                tags: ["billing_vat_number"]

Proximum\Vimeet\Domain\Model\EventTranslation:
    event_spanish_es:
        __construct: false
        description: "Descripción de mi evento en español"
        locale: es
        event: '@event_spanish'

Proximum\Vimeet\Domain\Model\Address (local):
    payment_address_event_spanish:
        __construct:
            - 855 Avenue Roger Salengro
            - 92370
            - CHAVILLE
            - fr

Proximum\Vimeet\Domain\Model\Type:
    event_spanish_type_fournisseur:
        __construct: ["@event_spanish"]
        position: 0
        maxParticipant: 4
        maxPlanning: 4
        registrationTemplate: '@registration_template_espagnol'

    event_spanish_type_exposant:
        __construct: ["@event_spanish"]
        position: 1
        maxParticipant: 4
        maxPlanning: 4
        registrationTemplate: '@registration_template_espagnol'

Proximum\Vimeet\Domain\Model\TypeTranslation:
    event_spanish_type_fournisseur_es:
        __construct: ['@event_spanish_type_fournisseur', 'es', "Exponente"]
    event_spanish_type_exposant_es:
        __construct: ['@event_spanish_type_exposant', 'es', "Inversor"]

