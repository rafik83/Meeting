Proximum\Vimeet\Domain\Model\Event:
    event_spanish:
        title: Evento en español
        domain: spanish-event.<domain()>
        timeZone: 'Europe/Paris'
        locales: [es]
        fallback: es
        assetPath: ''
        country: 'ES'
        organiserName: PROXIMUM
        paymentAddress: '@payment_address_event_spanish'
        configuration: '@configuration_event_spanish'
        organiserEmail: accounts@proximumgroup.com
        bankInfo: |+
            HSBC Issy les Moulineaux
            IBAN: FR76 3005 6006 4306 4332 4153 439
            SWIFT (BIC): CCFRFRPP
        legalInformation: |+
            IVA pagado en los recibos
            No hay descuento por pronto pago
        # vat mode :
        # - 'ati' = All Taxes Include : prices include taxes, no additional taxes computed
        # - 'et'  = Exclusive of Taxes : prices don't includes taxes, taxes are computed from prices
        mode: 'et'
        vat: 20
        elementToJoinWithInvoice: |+
            - Número de la factura
            - Nombre del evento
            - Pasivos netos
        billingTemplate:
            5645e4242d3df:
                type: lib_text
                required: true
                label: { es: "Nombre" }
                tags: ["billing_name"]
            5645e47e7e499:
                type: lib_text
                required: false
                label: { es: "teléfono" }
                tags: ["billing_phone"]
            5645e52f445d1:
                type: lib_email
                required: true
                label: { es: "E-mail" }
                tags: ["billing_email"]
            5645e534daa0b:
                type: lib_text
                required: true
                label: { es: "Empresa" }
                tags: ["billing_organization"]
            5645e54061ff2:
                type: lib_text
                required: true
                label: { es: "dirección" }
                tags: ["billing_address"]
            5645e5f35a9e0:
                type: lib_text
                required: true
                label: { es: "Código postal" }
                tags: ["billing_zipcode"]
            5645e6067f46a:
                type: lib_text
                required: true
                label: { es: "Ciudad" }
                tags: ["billing_city"]
            5645e5fd8f6a7:
                type: lib_country
                required: true
                label: { es: "país" }
                placeholder: { es: "--- Seleccionar un país  ---" }
                tags: ["billing_country"]
            5645e610e0e1b:
                type: lib_text
                required: false
                label: { es: "N° IVA" }
                tags: ["billing_vat_number"]

