Proximum\Vimeet\Domain\Model\Event:
    event_rdv_carnot_2016:
        __construct: false
        title: Les rendez-vous CARNOT 2016
        domain: rdv-carnot-2016.<domain()>
        timeZone: 'Europe/Paris'
        logo: 'integration/src/images/rdv-carnot-logo.png'
        locales: [fr, en]
        fallback: fr
        country: 'FR'
        organiserName: PROXIMUM
        configuration: '@event_rdv_carnot_2016_configuration'
        paymentAddress: '@event_rdv_carnot_2016_payment_address_event'
        organiserEmail: accounts@proximumgroup.com
        bankInfo: |+
            'HSBC Issy les Moulineaux
            IBAN: FR76 3005 6006 4306 4332 4153 439
            SWIFT (BIC): CCFRFRPP'
        legalInformation: |+
            TVA acquittée sur les encaissements
            Pas d'escompte pour paiement anticipé
        mode: 'et'
        vat: 20
        currency: 'EUR'
        assetPath: ''
        elementToJoinWithInvoice: |+
            - Numéro de la Facture
            - Nom de l'événement
            - Montant net à payer

