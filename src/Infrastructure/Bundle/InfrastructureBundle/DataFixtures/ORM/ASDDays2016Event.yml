Proximum\Vimeet\Domain\Model\Event:
    event_asddays_2016:
        title: "ASD Days"
        domain: asddays-2016.<domain()>
        timeZone: 'Europe/Paris'
        locales: [fr, en]
        fallback: fr
        assetPath: ''
        organiserName: "PROXIMUM"
        paymentAddress: '@payment_address_event_asddays_2016'
        configuration: '@configuration_asddays_2016'
        organiserEmail: "accounts@proximumgroup.com"
        bankInfo: |+
            HSBC Issy les Moulineaux
            IBAN: FR76 3005 6006 4306 4332 4153 439
            SWIFT (BIC): CCFRFRPP
        legalInformation: |+
            TVA acquittée sur les encaissements
            Pas d'escompte pour paiement anticipé
        # vat mode :
        # - 'ati' = All Taxes Include : prices include taxes, no additional taxes computed
        # - 'et'  = Exclusive of Taxes : prices don't includes taxes, taxes are computed from prices
        mode: 'et'
        vat: 20
        elementToJoinWithInvoice: |+
            - Numéro de la Facture
            - Nom de l'événement
            - Montant net à payer
        billingTemplate:
            5645e4242d3df:
                type: lib_text
                required: true
                label: { fr: "Nom", en: "Name" }
                tags: ["billing_name"]
            5645e47e7e499:
                type: lib_text
                required: false
                label: { fr: "Téléphone", en: "Phone" }
                tags: ["billing_phone"]
            5645e52f445d1:
                type: lib_email
                required: true
                label: { fr: "Email", en: "Email" }
                tags: ["billing_email"]
            5645e534daa0b:
                type: lib_text
                required: true
                label: { fr: "Raison sociale", en: "Company" }
                tags: ["billing_organization"]
            5645e54061ff2:
                type: lib_text
                required: true
                label: { fr: "Adresse", en: "Address" }
                tags: ["billing_address"]
            5645e5f35a9e0:
                type: lib_text
                required: true
                label: { fr: "Code postal", en: "Zip code" }
                tags: ["billing_zipcode"]
            5645e6067f46a:
                type: lib_text
                required: true
                label: { fr: "Ville", en: "City" }
                tags: ["billing_city"]
            5645e5fd8f6a7:
                type: lib_country
                required: true
                label: { fr: "Pays", en: "Country" }
                placeholder: { fr: "--- Sélectionner un pays  ---", en: "--- Sélectionner un pays  ---" }
                tags: ["billing_country"]
            5645e610e0e1b:
                type: lib_text
                required: false
                label: { fr: "N° de TVA intracommunautaire", en: "N° VAT" }
                tags: ["billing_vat_number"]

