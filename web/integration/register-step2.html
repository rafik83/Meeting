<!doctype html>
<html>
  <head>
    <title>Vimeet Intégration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">
    <link rel="stylesheet" href="dist/style.css">
  </head>

  <body>
    <div class="wrapper profile">
      <div class="header">
        <a href="">
          <img src="dist/images/asddays-logo.png" class="logo">
        </a>
        <div class="header__info">
          <p>Du 12/10/2016 au 13/10/2016</p>
          <p>Aéroport de Paris-Orly &bull; <span>France</span></p>
        </div>
        <ul class="header__navigation">
          <li>
            <a href="">
              <i class="icon-Appeler"></i>
            </a>
          </li>
        </ul>
      </div>

      <div class="profile__content">
        <section class="main">
          <header>
            <h1><img src="dist/images/icons/icon-key.svg"> Inscription <span>"Exposant"</span></h1>
          </header>

          <div class="main__content">
            <form>
              <a href="" class="back"><i class="icon-Retour"></i></a>
              <ul class="inputs">
                <li>
                  <div class="avatar">
                    <img src="dist/images/dummy/default-user.svg">
                  </div>
                </li>
                <li>
                  <input type="text" placeholder="Votre email...">
                </li>
                <li class="validation">
                  <button class="btn"><i class="icon-Suivant_3"></i> Suivant</button>
                </li>
              </ul>
            </form>

            <div class="sub-form">
              <a href="" class="help"><i class="icon-Appeler"></i> <span>Besoin d'aide</span></a>

              <a href="" class="btn key">
                Déjà inscrit ?
              </a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
