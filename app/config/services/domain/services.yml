services:
    domain.product.duplicator:
        class: Proximum\Vimeet\Domain\Product\Duplicator
        arguments:
            - '@adapter.local_file_storage'

    domain.package.duplicator:
        class: Proximum\Vimeet\Domain\Package\Duplicator
        arguments:
            - '@datetime'

    Proximum\Vimeet\Domain\Happening\Participation\DisableEnableParticipation:
        arguments:
            - '@vimeet_infrastructure.repository.happening_participation_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
