services:
    Proximum\Vimeet\Application\Query\Payment\PaymentConditionsViewQueryHandler:
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Payment\PaymentConditionsViewQuery }

    Proximum\Vimeet\Application\Query\Happening\Participant\ParticipantsAllowedToAccessQueryHandler:
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Happening\Participant\ParticipantsAllowedToAccessQuery }

    Proximum\Vimeet\Application\Query\Catalog\Export\SheetsViewQueryHandler:
        arguments:
            - '@vimeet_infrastructure.adapter.translator_adapter'
            - '@adapter.sheet_search_adapter'
            - '@Proximum\Vimeet\Application\Components\Sheet\Nomenclature\NomenclatureItemsGetter'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@Proximum\Vimeet\Application\Query\Catalog\Export\SheetViewQueryHandler'
            - '@Proximum\Vimeet\Application\Components\Catalog\GetViewedSheetsFromFilters'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Catalog\Export\SheetsViewQuery }

    Proximum\Vimeet\Application\Query\Catalog\Export\SheetRegistrationInfoQueryHandler:
        arguments:
            - '@vimeet_infrastructure.adapter.translator_adapter'

    Proximum\Vimeet\Application\Query\Catalog\Export\SheetInfoQueryHandler:
        public: false

    Proximum\Vimeet\Application\Query\Catalog\Export\SheetViewQueryHandler:
        arguments:
            - '@template.template_data_factory'
            - '@template.participant_info_guesser'
            - '@domain.service.category.category_name_resolver'
            - '@repository.rule_repository'
            - '@domain.rule.composer'
            - '@domain.rule.applyer'
            - '@Proximum\Vimeet\Application\Query\Catalog\Export\SheetInfoQueryHandler'
            - '@Proximum\Vimeet\Application\Query\Catalog\Export\SheetRegistrationInfoQueryHandler'
            - '@Proximum\Vimeet\Domain\Sheet\CanSeeSheet'

    Proximum\Vimeet\Application\Query\Happening\Webinar\GetWebinarViewQueryHandler:
        arguments:
            - '@Proximum\Vimeet\Application\Query\User\Event\Participant\GetUserParticipantInfosHandler'
            - '@Proximum\Vimeet\Infrastructure\Adapter\VideoConferenceAdapter'
            - '@Proximum\Vimeet\Infrastructure\Adapter\Mercure\NotificationSubscriber'
            - '@Proximum\Vimeet\Infrastructure\Adapter\Mercure\NotificationSubscriptions'
            - '@Proximum\Vimeet\Infrastructure\Repository\Happening\Webinar\RecordArchiveRepository'
            - '@Proximum\Vimeet\Infrastructure\Repository\Happening\HappeningBroadcastRepository'
            - '@Proximum\Vimeet\Domain\Happening\Webinar\IsRecordingAllowed'
            - '@vimeet_infrastructure.repository.happening_question_repository'
            - '@datetime'
            - '@Proximum\Vimeet\Application\Command\Happening\Webinar\Broadcast\StartViewerHandler'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Happening\Webinar\GetWebinarViewQuery }

    Proximum\Vimeet\Application\Query\Happening\Webinar\GetBroadcastViewQueryHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Repository\Happening\HappeningBroadcastRepository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Happening\Webinar\GetBroadcastViewQuery }

    Proximum\Vimeet\Application\Query\Happening\Webinar\Question\GetHappeningQuestionsHandler:
        arguments:
            - '@vimeet_infrastructure.repository.happening_question_repository'
            - '@Proximum\Vimeet\Domain\Event\GetTimezoneHelper'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Happening\Webinar\Question\GetHappeningQuestions }

    Proximum\Vimeet\Application\Command\Happening\Export\PrepareContentHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Adapter\QueryBus'
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\SerializerAdapter'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Happening\Export\PrepareContent }

    #
    # Participant
    #
    Proximum\Vimeet\Application\Query\Participant\Sheet\ParticipantListViewQueryHandler:
        arguments:
            - '@template.participant_info_guesser'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Participant\Sheet\ParticipantListViewQuery }

    Proximum\Vimeet\Application\Query\User\Event\Participant\GetUserParticipantInfosHandler:
        arguments:
            - '@template.participant_info_guesser'
            - '@sheet.sheet_guesser'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\User\Event\Participant\GetUserParticipantInfos }

    #
    # Form Template
    #
    Proximum\Vimeet\Application\Query\Template\Form\FormTemplateDataQueryHandler:
        arguments:
            - '@template.template_data_factory'
            - '@Proximum\Vimeet\Infrastructure\Repository\Sheet\FormDataRepository'
            - '@Proximum\Vimeet\Infrastructure\Repository\User\FormDataRepository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Template\Form\FormTemplateDataQuery }
    Proximum\Vimeet\Application\Query\Template\Form\FillStepQueryHandler:
        arguments:
            - '@Proximum\Vimeet\Application\Query\Template\Form\FormTemplateDataQueryHandler'
            - '@markdown'
            - '@Proximum\Vimeet\Application\Query\Template\Form\BreadCrumbViewQueryHandler'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Template\Form\FillStepQuery }

    Proximum\Vimeet\Application\Query\Template\Form\BreadCrumbViewQueryHandler: ~

    #
    # Catalog
    #
    Proximum\Vimeet\Application\Query\Catalog\NomenclatureTagViewQueryHandler:
        arguments:
            - '@catalog.tagged_nomenclature_filter_getter'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Catalog\NomenclatureTagViewQuery }

    #
    # Payment
    #
    Proximum\Vimeet\Application\Query\Package\Payment\InfoViewQueryHandler:
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Package\Payment\InfoViewQuery }

    #
    # Chat
    #
    Proximum\Vimeet\Application\Query\Chat\GuessChatMessageLinkableObjectHandler:
        arguments:
            - '@vimeet_infrastructure.repository.meeting_repository'
            - '@vimeet_infrastructure.repository.happening_repository'
            - '@vimeet_infrastructure.repository.event_repository'
            - '@Proximum\Vimeet\Infrastructure\Repository\ChatSessionRepository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Chat\GuessChatMessageLinkableObject }

    Proximum\Vimeet\Application\Query\Chat\ListChatMessagesHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Repository\ChatMessageRepository'
            - '@Proximum\Vimeet\Infrastructure\Repository\ChatMessageVoteRepository'
            - '@Proximum\Vimeet\Application\Components\Chat\CheckAccessToChatMessages'
            - '@Proximum\Vimeet\Domain\Event\GetTimezoneHelper'
            - '@adapter.router'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Chat\ListChatMessages }

    #
    # Sheet
    #
    Proximum\Vimeet\Application\Query\Sheet\Template\TemplateObjectUrlQueryHandler:
        arguments:
            - '@template.template_data_factory'
            - '@adapter.event_url_generator'
            - '@logger'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Sheet\Template\TemplateObjectUrlQuery }

    #
    # User Cta
    #
    Proximum\Vimeet\Application\Query\Navigation\Submenu\UserCtaSubmenuViewQueryHandler:
        arguments:
            - '@repository.event.extra_parameter_repository'
            - '@repository.user.event.extra_data_repository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Navigation\Submenu\UserCtaSubmenuViewQuery }

    #
    # Api
    #
    Proximum\Vimeet\Application\Query\Happening\GetApiListQueryHandler:
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Query\Happening\GetApiListQuery }
        arguments:
            - '@vimeet_infrastructure.repository.happening_repository'
