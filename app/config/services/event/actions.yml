services:
    #
    # Package
    #
    Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\Package\SummaryAction:
        arguments:
            - '@adapter.authorization_checker'
            - '@cart_cleaner'
            - '@package.funnel.funnel_factory'
            - '@adapter.router'
            - '@repository.billing_info_repository'
            - '@session.flash_bag'
            - '@form.factory'
            - '@Proximum\Vimeet\Infrastructure\Adapter\CommandBus'
            - '@Proximum\Vimeet\Infrastructure\Adapter\QueryBus'
            - '@templating'

    #
    # Order
    #
    Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\Order\SummaryTotalAction:
        arguments:
            - '@adapter.authorization_checker'
            - '@order.merger'
            - '@Proximum\Vimeet\Infrastructure\Adapter\QueryBus'
            - '@templating'

    #
    # Happening
    #
    Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\Happening\HappeningParticipateAction:
        arguments:
            - '@adapter.authorization_checker'
            - '@Proximum\Vimeet\Ui\Bundle\EventBundle\Handler\Happening\ParticipateHandler'

    #
    # Download file
    #
    Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\DownloadFileAction:
        arguments:
            - '@adapter.authorization_checker'
            - '@template.template_data_factory'
            - '@Proximum\Vimeet\Infrastructure\Encryption\UserEventDecryptFileAdapter'
            - '@vimeet_infrastructure.adapter.delayed_event_dispatcher'
            - '@serializer.normalizer.data_uri'
            - '@templating.engine.twig'
            - '%infrastructure.encrypted_files_path%'
            - '%kernel.project_dir%/web'

    #
    # Badge
    #
    Proximum\Vimeet\Ui\Bundle\EventBundle\Controller\Badge\ShowAction:
        arguments:
            - '@Proximum\Vimeet\Domain\Badge\AvailableChecker'
            - '@adapter.authorization_checker'
            - '@templating'
            - '@Proximum\Vimeet\Infrastructure\Adapter\QueryBus'
