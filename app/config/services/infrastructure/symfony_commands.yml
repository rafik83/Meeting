services:
    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\Event\Sheet\IndexSheetsByEventCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@Proximum\Vimeet\Infrastructure\Adapter\CommandBus'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\Event\IndexFromScratchCommand:
        arguments:
            - '@Proximum\Vimeet\Application\Command\Event\Index\IndexHandler'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\OMZ\ExportUserCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@repository.admin_repository'
            - '@Proximum\Vimeet\Infrastructure\Adapter\CommandBus'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\Participant\Export\ExportParticipantCommand:
        arguments:
            - '@Proximum\Vimeet\Application\Command\Participant\Export\ExportHandler'
            - '@vimeet_infrastructure.repository.event_repository'
            - '@Proximum\Vimeet\Infrastructure\Repository\Event\ExtraDataRepository'
            - '@repository.admin_repository'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\Event\User\Agenda\Version\GenerateVersionsForEventsCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@command.event.user.agenda.version.generate_versions_handler'
            - '@datetime'
        tags:
            - { name: console.command }

    Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Command\Clean\RemovePastAvailableSlotCommand:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@vimeet_infrastructure.repository.meeting_slot_repository'
