services:
    command.sheet.aggregate.sheets_available_slot_aggregator_handler:
        class: Proximum\Vimeet\Application\Command\Sheet\Aggregate\SheetsAvailableSlotAggregatorHandler
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@command.sheet.aggregate.available_slot_aggregator_handler'
    command.sheet.aggregate.available_slot_aggregator_handler:
        class: Proximum\Vimeet\Application\Command\Sheet\Aggregate\AvailableSlotAggregatorHandler
        arguments:
            - '@Proximum\Vimeet\Domain\Sheet\Aggregate\AvailableSlotCalculator'
    command.analytic.meeting_solution.create_handler:
        class: Proximum\Vimeet\Application\Command\Analytic\MeetingSolution\CreateHandler
        arguments:
            - '@adapter.serializer_adapter'
            - '@repository.analytic.meeting_solution_repository'
            - '@vimeet_infrastructure.repository.meeting_repository'
            - '@vimeet_infrastructure.repository.meeting.request_repository'
            - '@vimeet_infrastructure.repository.spot_repository'
            - '@vimeet_infrastructure.repository.meeting_slot_repository'
            - '@query.analytic.meeting_solution.sheet.sheet_satisfaction_list_query_handler'
            - '@query.analytic.meeting_solution.spot.spot_satisfaction_list_query_handler'
            - '@query.analytic.meeting_solution.spot_filling_rate.spot_filling_rate_query_handler'
            - '@query.analytic.meeting_solution.filling_rate_query_handler'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Analytic\MeetingSolution\Create }

    #
    # Extra Parameter
    #
    command.event.extra_parameter.create_handler:
        class: Proximum\Vimeet\Application\Command\Event\ExtraParameter\CreateHandler
        arguments:
            - '@repository.event.extra_parameter_repository'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Event\ExtraParameter\Create }

    command.event.extra_parameter.update_handler:
        class: Proximum\Vimeet\Application\Command\Event\ExtraParameter\UpdateHandler
        arguments:
            - '@repository.event.extra_parameter_repository'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Event\ExtraParameter\Update }
    command.event.extra_parameter.remove_handler:
        class: Proximum\Vimeet\Application\Command\Event\ExtraParameter\RemoveHandler
        arguments:
            - '@repository.event.extra_parameter_repository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Event\ExtraParameter\Remove }

    #
    # Sheet Phone
    #
    command.sheet.phone.update_phone_validation_status_handler:
        class: Proximum\Vimeet\Application\Command\Sheet\Phone\UpdatePhoneValidationStatusHandler
        arguments:
            - '@vimeet_infrastructure.repository.type_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@domain.sheet.phone.validation_calculator'

    #
    # User Event Token
    #
    command.user.event.token.update_agenda_confirmation_handler:
        class: Proximum\Vimeet\Application\Command\User\Event\Token\UpdateAgendaConfirmationHandler
        arguments:
            - '@vimeet_infrastructure.adapter.delayed_event_dispatcher'
            - '@repository.token.user_event_token_repository'
            - '@domain.token.user_event_token_generator'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\User\Event\Token\UpdateAgendaConfirmation }

    #
    # User Phone Ignore Confirmation
    #
    command.user.event.phone.ignore_confirmation:
        class: Proximum\Vimeet\Application\Command\User\Phone\IgnoreConfirmationHandler
        arguments:
            - '@repository.user.event.extra_data_repository'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\User\Phone\IgnoreConfirmation }

    #
    # Type Payment Conditions
    #
    Proximum\Vimeet\Application\Command\Type\PaymentConditions\UpdateHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Repository\Type\PaymentConditionsRepository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Type\PaymentConditions\Update }

    #
    # Tip
    #
    command.tip.event.create_handler:
        class: Proximum\Vimeet\Application\Command\Tip\Event\CreateHandler
        arguments:
            - '@repository.tip.repository'
            - '@vimeet_infrastructure.adapter.delayed_event_dispatcher'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Tip\Event\Create }

    command.tip.event.update_handler:
        class: Proximum\Vimeet\Application\Command\Tip\Event\UpdateHandler
        arguments:
            - '@repository.tip.repository'
            - '@vimeet_infrastructure.adapter.delayed_event_dispatcher'
            - '@datetime'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Tip\Event\Update }

    #
    # Event
    #
    Proximum\Vimeet\Application\Command\Event\Index\IndexHandler:
        arguments:
            - '@vimeet_infrastructure.repository.event_repository'
            - '@adapter.job_queue_adapter'

    Proximum\Vimeet\Application\Command\Event\PrepareIndexHandler:
        arguments:
            - '@adapter.job_queue_adapter'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Event\PrepareIndex }

    #
    # Event / Sheet
    #
    Proximum\Vimeet\Application\Command\Event\Sheet\IndexHandler:
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@adapter.sheet_indexer'
            - '@adapter.sheet_search_adapter'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Event\Sheet\Index }

    Proximum\Vimeet\Application\Command\Event\Sheet\PrepareSheetsIndexHandler:
        arguments:
            - '@adapter.job_queue_adapter'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\Event\Sheet\PrepareSheetsIndex }

    #
    # Availability Time Range
    #
    Proximum\Vimeet\Application\Command\AvailabilityTimeRange\CreateHandler:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Repository\AvailabilityTimeRangeRepository'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\AvailabilityTimeRange\Create }

    #
    # Sheet change Type
    #
    Proximum\Vimeet\Application\Command\Sheet\ChangeType\CancelPackageHandler:
        arguments:
            - '@vimeet_infrastructure.repository.order_repository'
            - '@cart_manager'
            - '@Proximum\Vimeet\Domain\Participant\ParticipantProductSetter'

    #
    # Export OMZ
    #
    Proximum\Vimeet\Application\Command\OMZ\ScheduleExportHandler:
        arguments:
            - '@adapter.job_queue_adapter'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\OMZ\ScheduleExport }

    Proximum\Vimeet\Application\Command\OMZ\PrepareContentHandler:
        arguments:
            - '@vimeet_infrastructure.repository.user_repository'
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@domain.service.sheets_group.group_name_resolver'
            - '@domain.service.sheets_group.type_name_resolver'
            - '@components.user.user_info_guesser'
            - '@planning.formatter.participant_planning_formatter'
            - '@adapter.serializer_adapter'

    Proximum\Vimeet\Application\Command\OMZ\NotifyHandler:
        arguments:
            - '@adapter.mailer_adapter'
            - '%mailer_sender%'

    Proximum\Vimeet\Application\Command\OMZ\PersistContentHandler:
        arguments:
            - '@adapter.local_file_storage'
            - '@repository.file_repository'
            - '%infrastructure.export_omz_path%'
            - '@datetime'

    Proximum\Vimeet\Application\Command\OMZ\ExportHandler:
        arguments:
            - '@Proximum\Vimeet\Application\Command\OMZ\PrepareContentHandler'
            - '@Proximum\Vimeet\Application\Command\OMZ\PersistContentHandler'
            - '@Proximum\Vimeet\Application\Command\OMZ\NotifyHandler'
        tags:
            - { name: tactician.handler, command: Proximum\Vimeet\Application\Command\OMZ\Export }
