services:

    #
    # Spot importer component
    #
    Proximum\Vimeet\Application\Components\Spot\SpotImporter:
        arguments:
            - '@vimeet_infrastructure.repository.sheet_repository'
            - '@adapter.validator_adapter'
            - '@vimeet_infrastructure.adapter.translator_adapter'
            - '@Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Adapter\SerializerAdapter'
            - '%infrastructure.import_spot_path%'

    #
    # Group
    #
    Proximum\Vimeet\Application\Components\Group\GroupDuplicator:
        arguments:
            - '@Proximum\Vimeet\Application\Command\Group\DuplicateToEventHandler'

    #
    # Template Data
    #
    Proximum\Vimeet\Application\Components\TemplateData\TemplateDataFileDuplicator:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Adapter\LocalFileStorageAdapter'

    Proximum\Vimeet\Application\Components\TemplateData\TemplateDataDuplicator:
        arguments:
            - '@template.template_data_factory'
            - '@Proximum\Vimeet\Application\Components\TemplateData\TemplateDataFileDuplicator'

    #
    # Form Template
    #
    Proximum\Vimeet\Application\Components\Template\Form\FormTemplateValidatorTranslated:
        arguments:
            - '@Proximum\Vimeet\Domain\Template\Form\FormTemplateValidator'
            - '@vimeet_infrastructure.adapter.translator_adapter'

    #
    # User Agenda Version
    #
    Proximum\Vimeet\Application\Components\User\Agenda\Version\VersionDiffVerbalizedGetter:
        arguments:
            - '@repository.user.agenda.version_repository'
            - '@domain.user.agenda.version.generator'
            - '@domain.user.agenda.version.diff_checker'
            - '@domain.user.agenda.version.diff_verbalizer'
            - '@datetime'

    #
    # Visio
    #
    Proximum\Vimeet\Application\Components\Visio\VisioSettingsRetriever:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Repository\Visio\VisioSettingsRepository'
            - '@Proximum\Vimeet\Application\Command\Visio\CreateVisioSettingsHandler'
