services:
    adapter.http_adapter:
        class: Proximum\Vimeet\Infrastructure\Adapter\HttpAdapter

    Proximum\Vimeet\Infrastructure\Adapter\CommandBus:
        arguments:
            $commandBus: '@tactician.commandbus'

    Proximum\Vimeet\Application\Adapter\CommandBusInterface: '@Proximum\Vimeet\Infrastructure\Adapter\CommandBus'

    Proximum\Vimeet\Infrastructure\Adapter\QueryBus:
        arguments:
            $commandBus: '@tactician.commandbus.query'

    Proximum\Vimeet\Application\Adapter\QueryBusInterface: '@Proximum\Vimeet\Infrastructure\Adapter\QueryBus'

    Proximum\Vimeet\Infrastructure\Adapter\ThirdParty\Jenkins\BuildCreatorAdapter:
        arguments:
            $execAdapter: '@Proximum\Vimeet\Infrastructure\Adapter\ExecAdapter'
            $jenkinsCommand: '%jenkins_command%'
            $jenkinsUser: '%jenkins_user%'
            $jenkinsPassword: '%jenkins_password%'
            $logger: '@logger'

    Proximum\Vimeet\Application\Adapter\ThirdParty\Jenkins\BuildCreatorInterface:
        alias: Proximum\Vimeet\Infrastructure\Adapter\ThirdParty\Jenkins\BuildCreatorAdapter

    Proximum\Vimeet\Infrastructure\Adapter\ExpressionLanguageAdapter: ~

    # Proximum\Vimeet\Infrastructure\Adapter\Elasticsearch\Sheet\TagFilterAggregator:
    #     arguments:
    #         - '@fos_elastica.index.sheet.sheet'

    Proximum\Vimeet\Infrastructure\Adapter\GoogleCloudStorageAdapter:
        arguments:
            - '%google_cloud_storage_config%'

    Proximum\Vimeet\Infrastructure\Adapter\TokboxRecordS3StorageAdapter:
        arguments:
            - '%aws_s3_key%'
            - '%aws_s3_secret%'
            - '%aws_s3_bucket_name%'
            - '%aws_s3_region%'
            - '%tokbox_api_key%'

    Proximum\Vimeet\Infrastructure\Adapter\UuidGenerator: ~

    Proximum\Vimeet\Infrastructure\Adapter\VideoStorageAdapter:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Adapter\GoogleCloudStorageAdapter'
            - '%google_cloud_storage_video_uri%'
            - '@Proximum\Vimeet\Infrastructure\Adapter\UuidGenerator'
            - '@Proximum\Vimeet\Infrastructure\Adapter\LocalFileStorageAdapter'

    #
    # Webinar Notifications (Mercure)
    #
    Proximum\Vimeet\Infrastructure\Adapter\Mercure\NotificationPublisher:
        arguments:
            - '%mercure_hub_publisher_url%'
            - '%mercure_publisher_key%'
            - '@adapter.http_adapter'
            - '@Proximum\Vimeet\Infrastructure\Adapter\Mercure\UserPayloadBuilder'
            - '@domain.key_dates.checker.ask_call_visio_private_chat_access_checker'

    Proximum\Vimeet\Infrastructure\Adapter\Mercure\NotificationSubscriber:
        arguments:
            - '%mercure_hub_subscriber_url%'
            - '%mercure_subscriber_key%'
            - '@Proximum\Vimeet\Infrastructure\Adapter\Mercure\UserPayloadBuilder'

    Proximum\Vimeet\Infrastructure\Adapter\Mercure\NotificationSubscriptions:
        arguments:
            - '%mercure_hub_publisher_url%'
            - '%mercure_subscriber_key%'
            - '@adapter.http_adapter'

    Proximum\Vimeet\Infrastructure\Adapter\Mercure\UserPayloadBuilder:
        arguments:
            - '@adapter.router'
            - '@command.planning.participant_info_guesser_cache'
            - '%locale%'

    #
    # Auto avatar (with initials)
    #
    Proximum\Vimeet\Infrastructure\Adapter\AvatarAdapter: ~

    Proximum\Vimeet\Infrastructure\Adapter\ZipRecordArchiveStorageAdapter:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Adapter\GoogleCloudStorageAdapter'
            - '%google_cloud_storage_video_uri%'
            - '@Proximum\Vimeet\Infrastructure\Adapter\UuidGenerator'
            - '@adapter.file_system_adapter'
            - '@Proximum\Vimeet\Infrastructure\Adapter\TokboxRecordS3StorageAdapter'
            - '@logger'
