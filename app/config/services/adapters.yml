services:
    adapter.http_adapter:
        class: Proximum\Vimeet\Infrastructure\Adapter\HttpAdapter

    Proximum\Vimeet\Infrastructure\Adapter\CommandBus:
        arguments:
            $commandBus: '@tactician.commandbus'

    Proximum\Vimeet\Application\Adapter\CommandBusInterface: '@Proximum\Vimeet\Infrastructure\Adapter\CommandBus'

    Proximum\Vimeet\Infrastructure\Adapter\QueryBus:
        arguments:
            $commandBus: '@tactician.commandbus.query'

    Proximum\Vimeet\Application\Adapter\QueryBusInterface: '@Proximum\Vimeet\Infrastructure\Adapter\QueryBus'

    adapter.exec_adapter:
        class: Proximum\Vimeet\Infrastructure\Adapter\ExecAdapter

    adapter.third_party.jenkins.build_creator_adapter:
        class: Proximum\Vimeet\Infrastructure\Adapter\ThirdParty\Jenkins\BuildCreatorAdapter
        arguments:
            - '@adapter.exec_adapter'
            - '%jenkins_command%'
            - '%jenkins_user%'
            - '%jenkins_password%'

    Proximum\Vimeet\Infrastructure\Adapter\ExpressionLanguageAdapter: ~

    Proximum\Vimeet\Infrastructure\Adapter\Elasticsearch\Sheet\TagFilterAggregator:
        arguments:
            - '@fos_elastica.index.app.sheet'

    Proximum\Vimeet\Infrastructure\Adapter\GoogleCloudStorageAdapter:
        arguments:
            - '%google_cloud_storage_config%'

    Proximum\Vimeet\Infrastructure\Adapter\UuidGenerator: ~

    Proximum\Vimeet\Infrastructure\Adapter\VideoStorageAdapter:
        arguments:
            - '@Proximum\Vimeet\Infrastructure\Adapter\GoogleCloudStorageAdapter'
            - '%google_cloud_storage_video_uri%'
            - '@Proximum\Vimeet\Infrastructure\Adapter\UuidGenerator'
            - '@adapter.local_file_storage'
