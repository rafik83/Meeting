default:
    path: /
    host: '%domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:urlRedirect
        path: /%locale%/
        permanent: true
    methods: [GET]

default_event:
    path: /
    methods: [GET]

default_admin:
    path: /admin
    host: '%domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:urlRedirect
        path: /admin/%locale%/
        permanent: true
    methods: [GET]

vimeet_admin:
    resource: '@AdminBundle/Resources/config/routing.yml'
    prefix:   /admin/{_locale}
    requirements:
        _locale: fr|en
    defaults:
        _locale: %locale%
    host:     '%domain%'

vimeet_event:
    resource: '@EventBundle/Resources/config/routing.yml'
    prefix:   /{_locale}
