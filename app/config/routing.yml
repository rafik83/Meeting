default:
    path: /
    host: '%domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:urlRedirect
        path: '/%locale%/'
        permanent: true
    methods: [GET]

default_event:
    path: /
    methods: [GET]

vimeet_event:
    resource: '@EventBundle/Resources/config/routing.yml'
    prefix:   /{_locale}

_liip_imagine:
    resource: "@LiipImagineBundle/Resources/config/routing.xml"

payum_capture:
    resource: "@PayumBundle/Resources/config/routing/capture.xml"

payum_notify:
    resource: "@PayumBundle/Resources/config/routing/notify.xml"

payum_authorize:
    resource: "@PayumBundle/Resources/config/routing/authorize.xml"

#
# Admin redirect
#
root_admin:
    path: /admin/{_locale}
    host: '%domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:redirect
        route: admin_event_list
        permanent: true
    methods: [GET]

default_admin:
    path: /admin
    host: '%domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:urlRedirect
        path: '/admin/%locale%/event'
        permanent: true
    methods: [GET]

vimeet_admin:
    resource: '@AdminBundle/Resources/config/routing.yml'
    prefix:   /admin/{_locale}
    requirements:
        _locale: fr|en
    defaults:
        _locale: '%locale%'
    host:     '%domain%'
