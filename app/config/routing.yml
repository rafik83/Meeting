#
# Admin
#
planner_callback:
    path: /planner/callback
    host: '%admin_domain%'
    defaults:
        _controller: AdminBundle:Planner\Callback:index
    methods: [POST]

jenkins_callback_sheet_print_pdf:
    path: /jenkins/callback/phantomjs/sheet/print-pdf
    host: '%admin_domain%'
    defaults:
        _controller: AdminBundle:ThirdParty\Jenkins\Callback:printSheetBuildCallback
    methods: [POST]

vimeet_healthcheck:
    path: /healthz
    controller: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Controller\HealthCheckAction
    methods: [GET]

root_admin:
    path: /{_locale}
    host: '%admin_domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:redirect
        route: admin_event_list
        permanent: true
    methods: [GET]

default_admin:
    path: /
    host: '%admin_domain%'
    defaults:
        _controller: FrameworkBundle:Redirect:urlRedirect
        path: '/%locale%/event'
        permanent: true
    methods: [GET]

vimeet_admin:
    resource: '@AdminBundle/Resources/config/routing.yml'
    prefix:   /{_locale}
    host: '%admin_domain%'
    requirements:
        _locale: fr|en
    defaults:
        _locale: '%locale%'

JMSJobQueueBundle:
    resource: "@JMSJobQueueBundle/Controller/"
    prefix: /{_locale}/jobs
    host: '%admin_domain%'
    type: annotation

#
# Event
#
default_event:
    path: /
    methods: [GET]

#
# User event authentication token
#
vimeet_event_authentication_token_login:
    path: /login
    methods: [GET]

#
# Trailing slash redirect to home event
#
default_redirect:
    path: /{_locale}
    defaults:
        _controller: FrameworkBundle:Redirect:redirect
        route: event
        permanent: true
    methods: [GET]

vimeet_event:
    resource: '@EventBundle/Resources/config/routing.yml'
    prefix: /{_locale}

_liip_imagine:
    resource: "@LiipImagineBundle/Resources/config/routing.yaml"

payum_capture:
    resource: "@PayumBundle/Resources/config/routing/capture.xml"

payum_notify:
    resource: "@PayumBundle/Resources/config/routing/notify.xml"

payum_authorize:
    resource: "@PayumBundle/Resources/config/routing/authorize.xml"
