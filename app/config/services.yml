# Learn more about services, parameters and containers at
# http://symfony.com/doc/current/service_container.html
parameters:
#    parameter_name: value

services:
    _defaults:
        # automatically injects dependencies in your services
        autowire: false
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: false
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    #
    # Twig extension
    #
    # twig.extension.intl:
    #     class: Twig_Extensions_Extension_Intl
    #     tags:
    #         - { name: twig.extension }

    #
    # Session handler
    #
    session.handler.pdo:
        class:     Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        public:    false
        arguments:
            - "mysql:host=%database_host%;port=%database_port%;dbname=%database_name%"
            - { db_username: "%database_user%", db_password: "%database_password%" }

    #
    # Form translation CollectionTypeExtension
    #
    form.extension.collection_type_extension:
        decorates: elao.form_translation.extension.collection_type_extension
        parent: elao.form_translation.extension.collection_type_extension
        autowire: false
        autoconfigure: false
        public: false
        tags:
            - { name: form.type_extension, extended_type: Symfony\Component\Form\Extension\Core\Type\CollectionType, priority: -10 }

imports:
    - { resource: services/repositories.yml }
    - { resource: services/adapters.yml }
    - { resource: services/domain/services.yml }
    - { resource: services/application/services.yml }
    - { resource: services/event/commands.yml }
    - { resource: services/event/queries.yml }
    - { resource: services/event/serializers.yml }
    - { resource: services/event/actions.yml }
    - { resource: services/event/components.yml }
    - { resource: services/event/templateSnippet.yml }
    - { resource: services/admin/queries.yml }
    - { resource: services/admin/commands.yml }
    - { resource: services/admin/components.yml }
    - { resource: services/admin/serializers.yml }
    - { resource: services/admin/actions.yml }
    - { resource: services/infrastructure/actions.yml }
    - { resource: services/infrastructure/symfony_commands.yml }
    - { resource: services/infrastructure/listeners.yml }
    - { resource: services/infrastructure/validators.yml }
    - { resource: services/third_party/services_tech_event.yml }
