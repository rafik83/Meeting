services:
    Proximum\Vimeet\Infrastructure\Adapter\SMS\MonologSMSSenderAdapter:
        arguments:
            - '@logger'

    Proximum\Vimeet\Infrastructure\Adapter\SMS\SMSProviders:
        calls:
            - [registerProvider, ['@Proximum\Vimeet\Infrastructure\Adapter\SMS\MonologSMSSenderAdapter']]

    adapter.sendgrid_api_adapter:
        class: Proximum\Vimeet\Infrastructure\Adapter\FakeEmailingSenderAdapter
        arguments:
            - '@logger'

    #
    # Fixture providers
    #
    vimeet_infrastructure.data_fixtures_orm.provider:
        class: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\DataFixtures\ORM\Provider
        arguments:
            - '%domain%'
        tags:
            - { name: hautelook_alice.faker.provider }
