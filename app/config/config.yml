imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }

# Put parameters here that don't need to change on each machine where the app is deployed
# http://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: fr

framework:
    #esi:             ~
    translator:
        fallbacks: ["%locale%"]
        logging: false
    secret:          "%secret%"
    router:
        resource: "%kernel.project_dir%/app/config/routing.yml"
        strict_requirements: ~
    form:            ~
    csrf_protection: ~
    validation:      { enable_annotations: false }
    serializer:      { enable_annotations: false }
    templating:
        engines: ['twig']
    default_locale:  "%locale%"
    trusted_hosts:   ~
#    trusted_proxies: "%trusted_proxies%"
    session:
        handler_id:      session.handler.pdo
        name:            vimeet
        gc_probability:  ~
        cookie_lifetime: 86400
        gc_maxlifetime:  86400
    fragments:       ~
    http_method_override: true
    assets:
        json_manifest_path: '%kernel.project_dir%/web/assets/manifest.json'
    php_errors:
        log: true

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    form_themes:
        - "@Ui/layout.html.twig"
    date:
        timezone: Europe/Paris
    paths:
        "%kernel.project_dir%/src/Ui/Resources/views": Ui
    globals:
        admin_menu_color: "%admin_menu_color%"

# Doctrine Configuration
doctrine:
    dbal:
        server_version: 5.6
        driver:   pdo_mysql
        host:     "%database_host%"
        port:     "%database_port%"
        dbname:   "%database_name%"
        user:     "%database_user%"
        password: "%database_password%"
        charset:  UTF8
        schema_filter: ~^(?!sessions)~
        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: "%kernel.root_dir%/data/data.db3"
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #     path:     "%database_path%"

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            entity:
                type: yml
                prefix: Proximum\Vimeet\Domain\Model
                dir: "%kernel.root_dir%/../src/Infrastructure/Bundle/InfrastructureBundle/Resources/config/doctrine/entity"
                alias: Entity
                is_bundle: false

# Swiftmailer Configuration
swiftmailer:
    default_mailer: default
    mailers:
        default:
            transport:  "%mailer_transport%"
            host:       "%mailer_host%"
            username:   "%mailer_user%"
            password:   "%mailer_password%"
            port:       "%mailer_port%"
            encryption: "%mailer_encryption%"
            spool:      { type: memory }
        error:
            transport:  "%mailer_error_transport%"
            host:       "%mailer_error_host%"
            username:   "%mailer_error_user%"
            password:   "%mailer_error_password%"
            port:       "%mailer_error_port%"
            encryption: "%mailer_error_encryption%"

# Sonata Intl Configuration
sonata_intl:
    timezone:
        default: Europe/Paris

# Elastica
fos_elastica:
    clients:
        default: { host: "%elastic_host%", port: "%elastic_port%", retryOnConflict: 2 }
    indexes:
        app:
            index_name: "app_%kernel.environment%"
            settings:
                index:
                    analysis:
                        analyzer:
                            lowercaseAnalyzer:
                                tokenizer: "keyword"
                                filter: "lowercase"
                            sheetAnalyzer:
                                tokenizer: "standard"
                                filter: ["standard", "lowercase"]
                            emailAnalyzer:
                                tokenizer: "uax_url_email"
                            autocomplete:
                                type: custom
                                tokenizer: "standard"
                                filter: ["standard", "lowercase", "autocomplete_filter", "asciifolding"]
                        filter:
                            autocomplete_filter:
                                type: edge_ngram
                                side: front
                                min_gram: 3
                                max_gram: 20
            types:
                sheet:
                    mappings:
                        id:
                            type: integer
                            index: "not_analyzed"
                        sheetName:
                            type: string
                            analyzer: "sheetAnalyzer"
                            fields:
                                raw:
                                    type: string
                                    analyzer: "lowercaseAnalyzer"
                                autocomplete:
                                    type: string
                                    analyzer: "autocomplete"
                        content:
                            type: string
                        content_en:
                            type: string
                            analyzer: "english"
                        content_fr:
                            type: string
                            analyzer: "french"
                        state:
                            type: string
                            index: "not_analyzed"
                        validationState:
                            type: string
                            index: "not_analyzed"
                        agendaConfirmedStatus:
                            type: string
                            index: "not_analyzed"
                        phoneValidationStatus:
                            type: string
                            index: "not_analyzed"
                        availabilityConfirmationStatus:
                            type: string
                            index: "not_analyzed"
                        enabled:
                            type: boolean
                        completed:
                            type: boolean
                        completeness:
                            type: integer
                        categories:
                            type: nested
                        booleanFilter:
                            type: nested
                            properties:
                                key:
                                    type: string
                        type:
                            type: integer
                        followUp:
                            type: integer
                            nullable: true
                            null_value: 0
                        commercialStatus:
                            type: string
                        participantNumber:
                            type: integer
                        participants:
                            type: nested
                            properties:
                                lastname:
                                    type: string
                                    analyzer: "sheetAnalyzer"
                                email:
                                    type: string
                                    analyzer: "emailAnalyzer"
                                position:
                                    type: string
                                    index: "not_analyzed"
                        event:
                            type: integer
                        owner:
                            type: integer
                        ownerEmail:
                            type: string
                        lastLoginAt:
                            type: date
                        imported:
                            type: boolean
                        createdAt:
                            type: date
                        remainingToPay:
                            type: float
                        inCatalog:
                            type: boolean
                        inCatalogAt:
                            type: date
                        orderStatus:
                            type: string
                        hasCart:
                            type: boolean
                        hasHappeningParticipation:
                            type: boolean
                        hasMeetingRequest:
                            type: boolean
                        hasPendingMeetingProposition:
                            type: boolean
                        hasScheduledMeeting:
                            type: boolean
                        hasInvoice:
                            type: boolean
                        hasSpot:
                            type: boolean
                        attend:
                            type: boolean
                        hasGroup:
                            type: boolean
                        reminderDate:
                            type: date
                            nullable: true
                        organizationCategory:
                            type: string
                            index: "not_analyzed"
                        nomenclatureItems:
                            type: nested
                            properties:
                                key:
                                    type: string
                        nomenclatureItemsSupply:
                            type: nested
                            properties:
                                key:
                                    type: string
                        nomenclatureItemsNeeds:
                            type: nested
                            properties:
                                key:
                                    type: string
                        zipcode:
                            type: string
                            index: "not_analyzed"
                        countryCode:
                            type: string
                            index: "not_analyzed"
                        city:
                            type: multi_field
                            fields:
                                city:
                                    type: string
                                    analyzer: "lowercaseAnalyzer"
                                city_autocomplete:
                                    type: string
                                    analyzer: "autocomplete"
                        country:
                            type: nested
                            index: "not_analyzed"
                            properties:
                                label:
                                    type: string
                                    analyzer: "lowercaseAnalyzer"
                                label_autocomplete:
                                    type: string
                                    analyzer: "autocomplete"
                                locale:
                                    type: string
                                    index: "not_analyzed"
                        keywords:
                            type: nested
                            index: "not_analyzed"
                            properties:
                                label:
                                    type: string
                                    analyzer: "lowercaseAnalyzer"
                                label_autocomplete:
                                    type: string
                                    analyzer: "autocomplete"
                                locale:
                                    type: string
                                    index: "not_analyzed"
                        availableSlotIds:
                            type: nested
                            properties:
                                id:
                                    type: integer
                    persistence:
                        model_to_elastica_transformer:
                            service: transformer.elastic.sheet_elastic_transformer
                        driver: orm
                        model: Proximum\Vimeet\Domain\Model\Sheet
                        provider: ~
                        listener: ~
                        finder: ~

# From translation
elao_form_translation:
    auto_generate: true

services:
    twig.extension.text:
        class: Twig_Extension_StringLoader
        tags:
            - { name: twig.extension }

infrastructure:
    eu_countries: ['at', 'be', 'bg', 'hr', 'cy', 'cz', 'dk', 'ee', 'fi', 'fr', 'de', 'gr', 'hu', 'ie', 'it', 'lv', 'lt', 'lu', 'mt', 'nl', 'pl', 'pt', 'ro', 'sk', 'si', 'es', 'se', 'gb']
    preferred_locales: ['fr', 'en', 'es', 'de', 'it', 'zh']
    default_locales: ['fr', 'en']
    supported_currencies: ['EUR', 'GBP', 'USD']
    web_asset_event_guideline_path: 'css/event'
    bundle_guideline_path: "%kernel.project_dir%/src/Ui/Bundle/EventBundle/Resources/assets/sass"
    font_path: "/assets/fonts"
    image_path: "/assets/images"
    print_planning_path: '%kernel.project_dir%/web/uploads/print_planning'
    print_sheet_path: '%kernel.project_dir%/web/uploads/print_sheet'
    export_transactions_path: '%kernel.project_dir%/web/uploads/export_transactions'
    export_order_path: '%kernel.project_dir%/web/uploads/export_orders'
    export_planner_path: '%kernel.project_dir%/web/uploads/export_planner'
    import_planner_path: '%kernel.project_dir%/web/uploads/import_planner'
    import_spot_path: '%kernel.project_dir%/web/uploads/import_spots/'
    export_omz_path: '%kernel.project_dir%/web/uploads/export_omz'
    package:
        default_labels:
            plans:
                fr: Forfait
                en: Plans
            participant_and_planning:
                fr: Participant et planning
                en: Participant and Planning
            options:
                fr: Options
                en: Options

tactician:
    commandbus:
        default:
            middleware:
                - tactician.middleware.doctrine
                - tactician.middleware.command_handler
        query:
            middleware:
                - tactician.middleware.validator
                - tactician.middleware.command_handler

#
# Liip Imagine Bundle
#
liip_imagine:
    driver: imagick
    resolvers:
       default:
          web_path: ~
    filter_sets:
        cache: ~
        event_header_logo:
            quality: 100
            filters:
                thumbnail: { size: [250, 100], mode: inset }
        event_sheet_image:
            quality: 100
            filters:
                thumbnail: { size: [800, 320], mode: inset }
        user_avatar:
            quality: 100
            filters:
                # Use the "outbound" mode to crop the image when the size ratio of the input differs
                thumbnail: { size: [160, 160], mode: outbound }
                # fix orientation issue for example for iOS photo
                auto_rotate: ~
        program_company_logo:
            quality: 100
            filters:
                thumbnail:  { size: [250, 100], mode: inset }

# Doctrine migrations configuration
doctrine_migrations:
    dir_name: "%kernel.project_dir%/src/Infrastructure/Bundle/InfrastructureBundle/Migrations"
    namespace: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Migrations
    table_name: migration_versions
    name: Application Migrations

payum:
    security:
        token_storage:
            Proximum\Vimeet\Domain\Model\Payment\PaymentToken: { doctrine: orm }
    storages:
        Proximum\Vimeet\Domain\Model\Payment\Payment: { doctrine: orm }
    gateways:
        paypal_express_checkout:
            factory: paypal_express_checkout
            username:  "%paypal_username%"
            password:  "%paypal_password%"
            signature: "%paypal_signature%"
            sandbox:   "%paypal_sandbox%"
            payum.action.store_notification: '@vimeet.payum.paypal.action.store_notification'
        offline:
            factory: offline

# Sentry configuration (Data source name)
sentry:
    dsn: "%sentry_dsn%"
    options:
        environment: "%kernel.environment%"
        error_types: E_ALL & ~E_WARNING & ~E_DEPRECATED & ~E_USER_DEPRECATED & ~E_USER_NOTICE & ~E_USER_WARNING & ~E_NOTICE & ~E_COMPILE_WARNING & ~E_CORE_WARNING

coop_tilleuls_ovh:
    endpoint_name:      "%ovh_endpoint_name%"
    application_key:    "%ovh_application_key%"
    application_secret: "%ovh_application_secret%"
    consumer_key:       "%ovh_consumer_key%"
