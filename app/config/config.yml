imports:
    - { resource: parameters.yml }
    - { resource: security.yml }
    - { resource: services.yml }

# Put parameters here that don't need to change on each machine where the app is deployed
# http://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: fr

framework:
    #esi:             ~
    translator:      { fallbacks: ["%locale%"] }
    secret:          "%secret%"
    router:
        resource: "%kernel.root_dir%/config/routing.yml"
        strict_requirements: ~
    form:            ~
    csrf_protection: ~
    validation:      { enable_annotations: true }
    #serializer:      { enable_annotations: true }
    templating:
        engines: ['twig']
        #assets_version: SomeVersionScheme
    default_locale:  "%locale%"
    trusted_hosts:   ~
    trusted_proxies: "%trusted_proxies%"
    session:
        handler_id:     session.handler.native_file
        save_path:      '%kernel.root_dir%/sessions'
        name:           vimeet
        gc_probability: ~
    fragments:       ~
    http_method_override: true
    assets: ~

# Twig Configuration
twig:
    debug:            "%kernel.debug%"
    strict_variables: "%kernel.debug%"
    form_themes:
        - "@Ui/layout.html.twig"
    date:
        timezone: Europe/Paris
    paths:
        "%kernel.root_dir%/../src/Ui/Resources/views": Ui

# Doctrine Configuration
doctrine:
    dbal:
        server_version: 5.6
        driver:   pdo_mysql
        host:     "%database_host%"
        port:     "%database_port%"
        dbname:   "%database_name%"
        user:     "%database_user%"
        password: "%database_password%"
        charset:  UTF8
        # if using pdo_sqlite as your database driver:
        #   1. add the path in parameters.yml
        #     e.g. database_path: "%kernel.root_dir%/data/data.db3"
        #   2. Uncomment database_path in parameters.yml.dist
        #   3. Uncomment next line:
        #     path:     "%database_path%"

    orm:
        auto_generate_proxy_classes: "%kernel.debug%"
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            entity:
                type: yml
                prefix: Proximum\Vimeet\Domain\Model
                dir: "%kernel.root_dir%/../src/Infrastructure/Bundle/InfrastructureBundle/Resources/config/doctrine/entity"
                alias: Entity
                is_bundle: false

# Swiftmailer Configuration
swiftmailer:
    default_mailer: default
    mailers:
        default:
            transport: "%mailer_transport%"
            host:      "%mailer_host%"
            username:  "%mailer_user%"
            password:  "%mailer_password%"
            port:      "%mailer_port%"
            spool:     { type: memory }
        error:
            transport: "%mailer_error_transport%"
            host:      "%mailer_error_host%"
            username:  "%mailer_error_user%"
            password:  "%mailer_error_password%"

# Sonata Intl Configuration
sonata_intl:
    timezone:
        default: Europe/Paris

# Elastica
fos_elastica:
    clients:
        default: { host: "%elastic_host%", port: "%elastic_port%" }
    indexes:
        app:
            index_name: "app_%kernel.environment%"
            settings:
                index:
                    analysis:
                        analyzer:
                            sheetAnalyzer:
                                tokenizer: "standard"
                                filter: ["standard", "lowercase"]
                            emailAnalyzer:
                                tokenizer: "uax_url_email"
            types:
                sheet:
                    mappings:
                        id:
                            type: integer
                        sheetName:
                            type: string
                            analyzer: "sheetAnalyzer"
                        state:
                            type: string
                        categories:
                            type: nested
                        type:
                            type: integer
                        followUp:
                            type: integer
                        participantNumber:
                            type: integer
                        participants:
                            type: nested
                            properties:
                                lastname:
                                    type: string
                                    analyzer: "sheetAnalyzer"
                                email:
                                    type: string
                                    analyzer: "emailAnalyzer"
                        event:
                            type: integer
                        owner:
                            type: integer
                        createdAt:
                            type: date
                    persistence:
                        model_to_elastica_transformer:
                            service: transformer.elastic.sheet_elastic_transformer
                        driver: orm
                        model: Proximum\Vimeet\Domain\Model\Sheet
                        provider: ~
                        listener: ~
                        finder: ~

# From translation
elao_form_translation:
    auto_generate: true

services:
    twig.extension.text:
       class: Twig_Extension_StringLoader
       tags:
           - { name: twig.extension }

infrastructure:
    eu_countries: ['at', 'be', 'bg', 'hr', 'cy', 'cz', 'dk', 'ee', 'fi', 'fr', 'de', 'gr', 'hu', 'ie', 'it', 'lv', 'lt', 'lu', 'mt', 'nl', 'pl', 'pt', 'ro', 'sk', 'si', 'es', 'se', 'gb']
    supported_currencies: ['EUR', 'GBP', 'USD']
    web_asset_event_guideline_path: 'css/event'
    bundle_guideline_path: "%kernel.root_dir%/../src/Ui/Bundle/EventBundle/Resources/assets/sass"
    font_path: "/assets/fonts"
    image_path: "/assets/images"
    package:
        default_labels:
            plans:
                fr: Forfait
                en: Plans
            participant_and_planning:
                fr: Participant et planning
                en: Participant and Planning
            options:
                fr: Options
                en: Options

tactician:
    commandbus:
        default:
            middleware:
                - tactician.middleware.doctrine
                - tactician.middleware.command_handler
        query:
            middleware:
                - tactician.middleware.validator
                - tactician.middleware.command_handler

#
# Liip Imagine Bundle
#
liip_imagine:
    driver: imagick
    resolvers:
       default:
          web_path: ~
    filter_sets:
        cache: ~
        event_header_logo:
            quality: 100
            filters:
                thumbnail: { size: [250, 100], mode: inset }

# Doctrine migrations configuration
doctrine_migrations:
    dir_name: "%kernel.root_dir%/../src/Infrastructure/Bundle/InfrastructureBundle/Migrations"
    namespace: Proximum\Vimeet\Infrastructure\Bundle\InfrastructureBundle\Migrations
    table_name: migration_versions
    name: Application Migrations
